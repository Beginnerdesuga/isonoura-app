name: update-map-data
on:
  schedule:
    - cron: '15 */3 * * *'   # 3時間ごと（UTC基準）
  push:
    branches: [main]         # HTMLなどを書き換えたときも公開し直す
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 波・風データ（失敗したら公開しない）
        run: python scripts/fetch_map.py
      - name: 潮位（失敗しても波データは更新）
        run: python scripts/fetch_tide.py
        continue-on-error: true
      - name: 公開用にまとめる
        run: |
          mkdir _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'scripts' --exclude 'README.md' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
