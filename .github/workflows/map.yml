name: update-map-data
on:
  schedule:
    - cron: '15 */3 * * *'   # 3時間ごと（UTC基準）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fetch_map.py
      - name: 潮位（失敗しても波データは更新）
        run: python scripts/fetch_tide.py
        continue-on-error: true
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/map-data.json data/tide.json
          git diff --cached --quiet || (git commit -m "update data" && git push)
