<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波高マップ（日本海〜紀伊半島）</title>
<style>
:root{--bg:#0b1d33;--tx:#f8fafc;--tx2:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",Arial,sans-serif}
body{background:var(--bg);color:var(--tx);max-width:600px;margin:0 auto;padding-bottom:20px}
.head{padding:10px 14px 6px;font-weight:800;font-size:1.5rem;display:flex;align-items:baseline;gap:14px}
.head .d{color:#38a8e8}.head .t{color:#f5a623;font-size:2rem}
canvas{display:block;width:100%;height:auto;background:#0f2a46}
.ctl{display:flex;align-items:center;gap:8px;padding:10px 12px}
.ctl button{background:#1e3a5f;color:#fff;border:none;border-radius:8px;width:40px;height:34px;font-size:1rem;cursor:pointer}
.ctl input[type=range]{flex:1}
.leg{padding:4px 14px;font-size:.8rem;color:#cbd5e1}
.leg .row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip i{display:inline-block;width:16px;height:16px;border-radius:4px}
.bar{display:flex}.bar i{width:34px;height:14px}
.note{padding:4px 14px;font-size:.68rem;color:#64748b;line-height:1.6}
#status{font-size:.7rem;color:#64748b;padding:0 14px}

/* ===== 共通タブバー ===== */
body{padding-bottom:92px!important}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:400px;display:flex;gap:4px;padding:5px;background:rgba(15,36,66,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:#b6c8dc;font-size:.78rem;font-weight:600;letter-spacing:.04em;padding:10px 4px;border-radius:999px;transition:background .2s,color .2s;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",Roboto,Arial,sans-serif}
.tabbar a.on{background:#7dd3fc;color:#07304f;font-weight:700}

/* ===== 共通トーン（3ページ共通の色・角丸・文字）===== */
*{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Segoe UI",Roboto,Arial,sans-serif}
body{background:linear-gradient(180deg,#0a1b33,#12365c)!important;padding-left:12px;padding-right:12px}
.head{padding:12px 2px 8px!important}
.head .d{color:#7dd3fc!important;font-size:1.25rem}
.head .t{color:#fde68a!important}
canvas{border-radius:18px}
.ctl{padding:10px 0!important}
.ctl button{background:rgba(255,255,255,.12)!important;border-radius:999px!important}
.ctl #now{background:#7dd3fc!important;color:#07304f!important;font-weight:700}
.ctl input[type=range]{accent-color:#7dd3fc}
.leg,.note,#status{padding-left:2px!important;padding-right:2px!important;color:#9fb4cc}
</style>
</head>
<body>
<div class="head"><span class="d" id="hd">--</span><span class="t" id="ht">--</span></div>
<canvas id="cv"></canvas>
<div class="ctl">
  <button id="prev">◀</button>
  <button id="play">▶</button>
  <button id="next">▶|</button>
  <input type="range" id="sl" min="0" max="0" value="0">
  <button id="now" style="width:auto;padding:0 10px;font-size:.75rem">現在</button>
</div>
<div class="leg">
  <div class="row"><span>地点の矢印＝風</span>
    <span class="chip"><i style="background:#8fb3e0"></i>〜2m</span>
    <span class="chip"><i style="background:#86c4aa"></i>3〜5m</span>
    <span class="chip"><i style="background:#dcc27e"></i>6〜9m</span>
    <span class="chip"><i style="background:#e39a8a"></i>10m〜</span></div>
  <div class="row"><span>海の色＝波高</span><span class="bar" id="bar"></span><span style="font-size:.7rem">50cm刻み</span></div>
  <div style="font-size:.75rem">白矢印＝波の向き ／ 色矢印＝風</div>
</div>
<div id="status"></div>
<p class="note">※ 波高は数km〜数十km格子のモデル値を補間した目安で、沿岸の実際とは異なります。地点の座標・ラベル位置はdata/map-config.jsonで調整できます（沖側の座標を指定）。</p>

const BANDS = ['#3b5b92','#4a7fae','#5fa3b5','#7ab08a','#c2b872','#cf9a6b','#b97f9c','#c98a82','#b4574f'];
const W = 600;
const BB = CONFIG.bbox;
const COSLAT = Math.cos(34.7 * Math.PI / 180);
const H = Math.round(W * (BB.lat1 - BB.lat0) / ((BB.lon1 - BB.lon0) * COSLAT));
const P = (lon, lat) => [(lon - BB.lon0) / (BB.lon1 - BB.lon0) * W, (BB.lat1 - lat) / (BB.lat1 - BB.lat0) * H];

const cv = document.getElementById('cv');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
cv.width = W * dpr; cv.height = H * dpr;
const ctx = cv.getContext('2d');

let DATA = null, idx = 0, nowIdx = 0, timer = null;
let valid = [];       // 波高が取れた格子点
let cells = null;     // 補間用の近傍リスト
const CELL = 4, CW = Math.ceil(W / CELL), CH = Math.ceil(H / CELL);
const field = document.createElement('canvas'); field.width = CW; field.height = CH;

// ---- 補助 ----
const DIRS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
const dirName = d => d == null ? '--' : DIRS[Math.round(d / 22.5) % 16];
const windColor = s => s <= 2.4 ? '#8fb3e0' : s < 5.5 ? '#86c4aa' : s < 9.5 ? '#dcc27e' : '#e39a8a';
const hexRGB = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const BAND_RGB = BANDS.map(hexRGB);
document.getElementById('bar').innerHTML = BANDS.map(c => `<i style="background:${c}"></i>`).join('');

// ---- データ取得 ----
async function loadData() {
  const st = document.getElementById('status');
  try {
    const r = await fetch('data/map-data.json?' + Date.now());
    if (r.ok) {
      const j = await r.json();
      if (j.times && j.grid && j.grid.length) { st.textContent = 'データ: 定期取得（' + j.generated.replace('T', ' ').slice(0, 16) + '）'; return j; }
    }
  } catch (e) { /* フォールバックへ */ }
  st.textContent = 'データ: ブラウザから直接取得（粗い格子）。定期取得を設定すると高精細になります。';
  return await fetchLive();
}

async function fetchLive() {
  const g = CONFIG.grid;
  const fr = (a, b, s) => Array.from({ length: Math.round((b - a) / s) + 1 }, (_, i) => +(a + i * s).toFixed(4));
  const lats = fr(g.lat0, g.lat1, g.step).filter((_, i) => i % 2 === 0);
  const lons = fr(g.lon0, g.lon1, g.step).filter((_, i) => i % 2 === 0);
  const pts = []; lats.forEach(la => lons.forEach(lo => pts.push([la, lo])));
  const asList = j => Array.isArray(j) ? j : [j];
  const grid = []; let times = null;
  for (let i = 0; i < pts.length; i += 40) {
    const ch = pts.slice(i, i + 40);
    const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${ch.map(p => p[0]).join(',')}&longitude=${ch.map(p => p[1]).join(',')}&hourly=wave_height,wave_direction&timezone=Asia%2FTokyo&forecast_days=${CONFIG.days}`;
    const res = asList(await (await fetch(url)).json());
    res.forEach((it, k) => { times = times || it.hourly.time; grid.push({ lat: ch[k][0], lon: ch[k][1], h: it.hourly.wave_height, d: it.hourly.wave_direction }); });
  }
  const sp = CONFIG.spots;
  const wurl = `https://api.open-meteo.com/v1/forecast?latitude=${sp.map(s => s.lat).join(',')}&longitude=${sp.map(s => s.lon).join(',')}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=${CONFIG.days}`;
  const wres = asList(await (await fetch(wurl)).json());
  const wind = wres.map(w => ({ wspd: w.hourly.wind_speed_10m, wdir: w.hourly.wind_direction_10m }));
  return { generated: new Date().toISOString(), times, grid, wind };
}

// ---- 補間の下準備 ----
function prepare() {
  valid = DATA.grid.filter(p => p.h && p.h.some(v => v != null));
  cells = new Array(CW * CH);
  const R2 = 0.8 * 0.8;
  for (let cy = 0; cy < CH; cy++) {
    for (let cx = 0; cx < CW; cx++) {
      const lon = BB.lon0 + ((cx + .5) * CELL / W) * (BB.lon1 - BB.lon0);
      const lat = BB.lat1 - ((cy + .5) * CELL / H) * (BB.lat1 - BB.lat0);
      cells[cy * CW + cx] = nearest(lat, lon, 5, R2);
    }
  }
}
function nearest(lat, lon, k, r2) {
  const arr = [];
  for (let i = 0; i < valid.length; i++) {
    const dx = (valid[i].lon - lon) * COSLAT, dy = valid[i].lat - lat;
    const d2 = dx * dx + dy * dy;
    if (d2 <= r2) arr.push([d2, i]);
  }
  arr.sort((a, b) => a[0] - b[0]);
  return arr.slice(0, k).map(([d2, i]) => [i, 1 / (d2 + 0.01)]);
}
function valueAt(nb, t) {
  let s = 0, w = 0;
  for (const [i, wt] of nb) { const v = valid[i].h[t]; if (v != null) { s += v * wt; w += wt; } }
  return w ? s / w : null;
}

// ---- 描画 ----
function arrow(x, y, ang, len, color, lw) {
  // ang: 進行方向（北基準・度）
  const r = ang * Math.PI / 180, dx = Math.sin(r), dy = -Math.cos(r);
  const x1 = x - dx * len / 2, y1 = y - dy * len / 2, x2 = x + dx * len / 2, y2 = y + dy * len / 2;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const hl = len * .38, hw = len * .22;
  ctx.beginPath();
  ctx.moveTo(x2 + dx * 2, y2 + dy * 2);
  ctx.lineTo(x2 - dx * hl - dy * hw, y2 - dy * hl + dx * hw);
  ctx.lineTo(x2 - dx * hl + dy * hw, y2 - dy * hl - dx * hw);
  ctx.closePath(); ctx.fill();
}

function draw() {
  if (!DATA) return;
  const t = idx;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0f2a46'; ctx.fillRect(0, 0, W, H);

  // 海の色（低解像度で塗って拡大＝なめらかに）
  const fctx = field.getContext('2d');
  const img = fctx.createImageData(CW, CH);
  for (let i = 0; i < cells.length; i++) {
    const v = valueAt(cells[i], t);
    const o = i * 4;
    if (v == null) { img.data[o + 3] = 0; continue; }
    const c = BAND_RGB[Math.min(8, Math.floor(v / 0.5))];
    img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
  }
  fctx.putImageData(img, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(field, 0, 0, W, H);

  // 陸地
  ctx.fillStyle = '#14304f'; ctx.strokeStyle = '#2f5a85'; ctx.lineWidth = 1; ctx.lineJoin = 'round';
  LAND.forEach(ring => {
    ctx.beginPath();
    ring.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });

  // 波の向き（白矢印）：格子を1つおきに表示
  const g = CONFIG.grid;
  valid.forEach(p => {
    const i = Math.round((p.lon - g.lon0) / g.step), j = Math.round((p.lat - g.lat0) / g.step);
    if (i % 2 || j % 2) return;
    const d = p.d && p.d[t]; if (d == null) return;
    const [x, y] = P(p.lon, p.lat);
    arrow(x, y, (d + 180) % 360, 22, 'rgba(255,255,255,.85)', 2.4);
  });

  // 地点（風の色矢印・ラベル）
  const spots = CONFIG.spots;
  spots.forEach((s, k) => {
    const [x, y] = P(s.lon, s.lat);
    const wd = DATA.wind[k];
    const sp = wd && wd.wspd[t] != null ? wd.wspd[t] : null;
    const dir = wd ? wd.wdir[t] : null;
    const wave = valueAt(nearest(s.lat, s.lon, 4, 0.8 * 0.8), t);

    const bx = x + s.dx, by = y + s.dy, bw = 108, bh = 56;
    // 引き出し線
    ctx.strokeStyle = 'rgba(203,213,225,.7)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(Math.max(bx, Math.min(x, bx + bw)), Math.max(by, Math.min(y, by + bh))); ctx.stroke();
    // 風矢印
    if (sp != null && dir != null) arrow(x, y, (dir + 180) % 360, 26, windColor(sp), 3);
    ctx.fillStyle = '#e5e7eb'; ctx.beginPath(); ctx.arc(x, y, 4, 0, 7); ctx.fill();

    // ラベル
    ctx.fillStyle = 'rgba(15,40,70,.93)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, 6) : ctx.rect(bx, by, bw, bh); ctx.fill();
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#fff'; ctx.font = '700 14px sans-serif'; ctx.fillText(s.name, bx + 7, by + 17);
    ctx.fillStyle = sp != null ? windColor(sp) : '#94a3b8'; ctx.font = '600 12px sans-serif';
    ctx.fillText(sp != null ? `${dirName(dir)} ${Math.round(sp)}m/s` : '--', bx + 7, by + 34);
    ctx.fillStyle = '#5fb8ff'; ctx.font = '700 13px sans-serif';
    ctx.fillText(wave != null ? `波高 ${wave.toFixed(2)}m` : '波高 --', bx + 7, by + 50);
  });

  // ヘッダー
  const d = new Date(DATA.times[t]);
  document.getElementById('hd').textContent = `${d.getMonth() + 1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`;
  document.getElementById('ht').textContent = `${d.getHours()}時`;
  document.getElementById('sl').value = t;
}

// ---- 操作 ----
const sl = document.getElementById('sl');
function setIdx(i) { idx = Math.max(nowIdx, Math.min(DATA.times.length - 1, i)); draw(); }
function stop() { if (timer) { clearInterval(timer); timer = null; document.getElementById('play').textContent = '▶'; } }
document.getElementById('prev').onclick = () => { stop(); setIdx(idx - 1); };
document.getElementById('next').onclick = () => { stop(); setIdx(idx + 1); };
document.getElementById('now').onclick = () => { stop(); setIdx(nowIdx); };
sl.oninput = () => { stop(); setIdx(+sl.value); };
document.getElementById('play').onclick = () => {
  if (timer) return stop();
  document.getElementById('play').textContent = '⏸';
  timer = setInterval(() => setIdx(idx >= DATA.times.length - 1 ? nowIdx : idx + 1), 500);
};

(async function init() {
  try {
    DATA = await loadData();
    prepare();
    const now = new Date(); let best = Infinity;
    DATA.times.forEach((t, i) => { const d = Math.abs(new Date(t) - now); if (d < best) { best = d; nowIdx = i; } });
    sl.max = DATA.times.length - 1;
    sl.min = nowIdx;
    setIdx(nowIdx);
  } catch (e) { document.getElementById('status').textContent = 'エラー: ' + e.message; }
})();
