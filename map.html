<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="磯の浦">
<title>波高マップ（日本海〜紀伊半島）</title>
<style>
:root{--bg:#0b1d33;--tx:#f8fafc;--tx2:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans",Arial,sans-serif}
body{background:var(--bg);color:var(--tx);max-width:600px;margin:0 auto;padding-bottom:20px}
.head{padding:10px 14px 6px;font-weight:800;font-size:1.5rem;display:flex;align-items:baseline;gap:14px}
.head .d{color:#38a8e8}.head .t{color:#f5a623;font-size:2rem}
canvas{display:block;width:100%;height:auto;background:#0f2a46}
.ctl{display:flex;align-items:center;gap:8px;padding:10px 12px}
.ctl button{background:#1e3a5f;color:#fff;border:none;border-radius:8px;width:40px;height:34px;font-size:1rem;cursor:pointer}
.ctl input[type=range]{flex:1}
.leg{padding:4px 14px;font-size:.8rem;color:#cbd5e1}
.leg .row{display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px}
.chip i{display:inline-block;width:16px;height:16px;border-radius:4px}
.bar{display:flex}.bar i{width:34px;height:14px}
.note{padding:4px 14px;font-size:.68rem;color:#64748b;line-height:1.6}
#status{font-size:.7rem;color:#64748b;padding:0 14px}

/* ===== 共通タブバー ===== */
body{padding-bottom:92px!important}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));width:calc(100% - 28px);max-width:400px;display:flex;gap:4px;padding:5px;background:rgba(15,36,66,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.14);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100}
.tabbar a{flex:1;text-align:center;text-decoration:none;color:#b6c8dc;font-size:.78rem;font-weight:600;letter-spacing:.04em;padding:10px 4px;border-radius:999px;transition:background .2s,color .2s;white-space:nowrap;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",Roboto,Arial,sans-serif}
.tabbar a.on{background:#7dd3fc;color:#07304f;font-weight:700}

/* ===== 共通トーン（3ページ共通の色・角丸・文字）===== */
*{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Segoe UI",Roboto,Arial,sans-serif}
body{background:linear-gradient(180deg,#0a1b33,#12365c)!important;padding-top:0;padding-left:0;padding-right:0}
.head{padding:12px 2px 8px!important}
.head .d{color:#7dd3fc!important;font-size:1.25rem}
.head .t{color:#fde68a!important}
canvas{border-radius:0}
.ctl{padding:10px 0!important}
.ctl button{background:rgba(255,255,255,.12)!important;border-radius:999px!important}
.ctl #now{background:#7dd3fc!important;color:#07304f!important;font-weight:700}
.ctl input[type=range]{accent-color:#7dd3fc}
#mapwrap{position:relative;height:calc(100vh - 130px);height:calc(100dvh - 130px);overflow:hidden}
#mapwrap canvas{width:100%;height:100%;object-fit:fill}
#mapwrap{touch-action:none}
#tl{touch-action:pan-x}
#dbar button,#now,#fit{touch-action:manipulation}
#dock{position:absolute;left:0;right:0;bottom:0}
#dbar{display:flex;align-items:stretch;background:rgba(10,27,51,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#play{width:56px;flex:none;background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer}
#tlw{position:relative;flex:1;min-width:0}
#tl{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tl::-webkit-scrollbar{display:none}
#tin{display:inline-flex;padding:0 50%}
.dg{flex:none;border-left:1.5px solid rgba(255,255,255,.2)}
.dg:first-child{border-left:none}
.dl{text-align:center;color:#e5e7eb;font-size:.85rem;padding:11px 0 7px;white-space:nowrap}
.hr{display:flex;height:0;overflow:hidden;opacity:0;transition:height .25s,opacity .25s;color:#9fb4cc;font-size:.72rem}
.hr span{flex:none;text-align:center}
#dock.open .hr{height:22px;opacity:1}
#ph{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:#fde68a;pointer-events:none}
#pill{position:absolute;left:50%;top:-28px;transform:translateX(-50%);background:#fde68a;color:#07304f;font-size:.85rem;padding:3px 16px;border-radius:8px 8px 0 0;white-space:nowrap;pointer-events:none}
#fit{position:absolute;left:10px;top:-38px;background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 16px;font-size:.8rem;cursor:pointer}
#now{position:absolute;right:10px;top:-38px;background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:7px 16px;font-size:.8rem;cursor:pointer}.note,#status{padding-left:14px!important;padding-right:14px!important;color:#9fb4cc}
.leg{padding:4px 14px!important;color:#9fb4cc}
</style>
</head>

</div>

const kxOf = () => cssW / view.span;
const kyOf = () => kxOf() / COSLAT;
const P = (lo, la) => [(lo - view.clon) * kxOf() + cssW / 2, (view.clat - la) * kyOf() + cssH / 2];

  const cl = (v, lo, hi) => lo > hi ? (lo + hi) / 2 : Math.max(lo, Math.min(hi, v));
  view.clon = cl(view.clon, BASE.lon0 + hx, BASE.lon1 - hx);

// ---- データ取得 ----
async function loadData() {
  const st = document.getElementById('status');
  try {
    const r = await fetch('data/map-data.json?' + Date.now());
    if (r.ok) {
      const j = await r.json();
      if (j.times && j.grid && j.grid.length) { st.textContent = 'データ: 定期取得（' + j.generated.replace('T', ' ').slice(0, 16) + '）'; return j; }
    }
  } catch (e) { /* フォールバックへ */ }
  st.textContent = 'データ: ブラウザから直接取得（粗い格子）。定期取得を設定すると高精細になります。';
  return await fetchLive();
}
async function fetchLive() {
  const g = CONFIG.grid;
  const fr = (a, b, s) => Array.from({ length: Math.round((b - a) / s) + 1 }, (_, i) => +(a + i * s).toFixed(4));
  const lats = fr(g.lat0, g.lat1, g.step).filter((_, i) => i % 2 === 0);
  const lons = fr(g.lon0, g.lon1, g.step).filter((_, i) => i % 2 === 0);
  const pts = []; lats.forEach(la => lons.forEach(lo => pts.push([la, lo])));
  const asList = j => Array.isArray(j) ? j : [j];
  const grid = []; let times = null;
  for (let i = 0; i < pts.length; i += 40) {
    const ch = pts.slice(i, i + 40);
    const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${ch.map(p => p[0]).join(',')}&longitude=${ch.map(p => p[1]).join(',')}&hourly=wave_height,wave_direction&timezone=Asia%2FTokyo&forecast_days=${CONFIG.days}`;
    const res = asList(await (await fetch(url)).json());
    res.forEach((it, k) => { times = times || it.hourly.time; grid.push({ lat: ch[k][0], lon: ch[k][1], h: it.hourly.wave_height, d: it.hourly.wave_direction }); });
  }
  const sp = CONFIG.spots;
  const wurl = `https://api.open-meteo.com/v1/forecast?latitude=${sp.map(s => s.lat).join(',')}&longitude=${sp.map(s => s.lon).join(',')}&hourly=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=${CONFIG.days}`;
  const wres = asList(await (await fetch(wurl)).json());
  const wind = wres.map(w => ({ wspd: w.hourly.wind_speed_10m, wdir: w.hourly.wind_direction_10m }));
  return { generated: new Date().toISOString(), times, grid, wind };
}

// ---- 波高の補間（格子の近い点から重み付き平均）----
function prepare() {
  valid = DATA.grid.filter(p => p.h && p.h.some(v => v != null));
  const g = CONFIG.grid;
  NI = Math.round((g.lon1 - g.lon0) / g.step) + 3;
  gridIdx = new Array(NI * (Math.round((g.lat1 - g.lat0) / g.step) + 3)).fill(null);
  valid.forEach(p => {
    const i = Math.round((p.lon - g.lon0) / g.step) + 1, j = Math.round((p.lat - g.lat0) / g.step) + 1;
    if (i >= 0 && i < NI && j >= 0) gridIdx[j * NI + i] = p;
  });
}
function valueGrid(lon, lat, t) {
  const g = CONFIG.grid;
  const i0 = Math.round((lon - g.lon0) / g.step) + 1, j0 = Math.round((lat - g.lat0) / g.step) + 1;
  let s = 0, w = 0;
  for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
    const i = i0 + di, j = j0 + dj;
    if (i < 0 || i >= NI || j < 0) continue;
    const p = gridIdx[j * NI + i];
    if (!p) continue;
    const v = p.h[t]; if (v == null) continue;
    const dx = (p.lon - lon) * COSLAT, dy = p.lat - lat, d2 = dx * dx + dy * dy;
    if (d2 > 0.64) continue;
    const wt = 1 / (d2 + 0.01); s += v * wt; w += wt;
  }
  return w ? s / w : null;
}

// 海の色の下絵（全体を低解像度で作って、拡大縮小のときは引き伸ばす）
const FW = 200, FH = Math.round(FW * ((BASE.lat1 - BASE.lat0) / (BASE.lon1 - BASE.lon0)) / COSLAT);
const field = document.createElement('canvas'); field.width = FW; field.height = FH;
let fieldT = -1;
function buildField(t) {
  const fctx = field.getContext('2d');
  const img = fctx.createImageData(FW, FH);
  for (let cy = 0; cy < FH; cy++) {
    const lat = BASE.lat1 - (cy + .5) / FH * (BASE.lat1 - BASE.lat0);
    for (let cx = 0; cx < FW; cx++) {
      const lon = BASE.lon0 + (cx + .5) / FW * (BASE.lon1 - BASE.lon0);
      const v = valueGrid(lon, lat, t), o = (cy * FW + cx) * 4;
      if (v == null) continue;
      const c = BAND_RGB[Math.min(8, Math.floor(v / 0.5))];
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }
  fctx.putImageData(img, 0, 0); fieldT = t;
}

// ---- 描画 ----
function arrow(x, y, ang, len, color, lw) {
  const r = ang * Math.PI / 180, dx = Math.sin(r), dy = -Math.cos(r);
  const x1 = x - dx * len / 2, y1 = y - dy * len / 2, x2 = x + dx * len / 2, y2 = y + dy * len / 2;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const hl = len * .38, hw = len * .22;
  ctx.beginPath();
  ctx.moveTo(x2 + dx * 2, y2 + dy * 2);
  ctx.lineTo(x2 - dx * hl - dy * hw, y2 - dy * hl + dx * hw);
  ctx.lineTo(x2 - dx * hl + dy * hw, y2 - dy * hl - dx * hw);
  ctx.closePath(); ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
}

let raf = 0;
function schedule() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); }); }

function draw() {
  if (!DATA) return;
  const t = idx, kx = kxOf(), ky = kyOf();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0f2a46'; ctx.fillRect(0, 0, cssW, cssH);

  // 海の色
  if (fieldT !== t) buildField(t);
  const [fx, fy] = P(BASE.lon0, BASE.lat1);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(field, fx, fy, (BASE.lon1 - BASE.lon0) * kx, (BASE.lat1 - BASE.lat0) * ky);

  // 陸地
  ctx.fillStyle = '#14304f'; ctx.strokeStyle = '#2f5a85'; ctx.lineWidth = 1; ctx.lineJoin = 'round';
  LAND.forEach(ring => {
    ctx.beginPath();
    ring.forEach(([lo, la], i) => { const [x, y] = P(lo, la); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    ctx.closePath(); ctx.fill(); ctx.stroke();
  });

  // 波の向き（白矢印）：混み合うときは間引く
  const g = CONFIG.grid;
  const stride = Math.max(1, Math.ceil(46 / (g.step * kx)));
  valid.forEach(p => {
    const i = Math.round((p.lon - g.lon0) / g.step), j = Math.round((p.lat - g.lat0) / g.step);
    if (i % stride || j % stride) return;
    const d = p.d && p.d[t]; if (d == null) return;
    const [x, y] = P(p.lon, p.lat);
    if (x < -20 || x > cssW + 20 || y < -20 || y > cssH + 20) return;
    arrow(x, y, (d + 180) % 360, 20, 'rgba(255,255,255,.85)', 2.2);
  });

  // 地点：位置・風・カードの大きさを先に決める
  const items = [];
  CONFIG.spots.forEach((s, k) => {
    const [x, y] = P(s.lon, s.lat);
    if (x < -30 || x > cssW + 30 || y < -30 || y > cssH + 30) return;
    const wd = DATA.wind[k];
    const sp = wd && wd.wspd[t] != null ? wd.wspd[t] : null;
    const dir = wd ? wd.wdir[t] : null;
    const wave = valueGrid(s.lon, s.lat, t);
    const nameT = s.name, waveT = wave != null ? wave.toFixed(2) + 'm' : '--';
    const dirT = sp != null ? dirName(dir) : '--', spT = sp != null ? Math.round(sp) + 'm/s' : '';
    ctx.font = '11px sans-serif'; const wn = ctx.measureText(nameT).width;
    ctx.font = '15px serif'; const ww = ctx.measureText(waveT).width;
    ctx.font = '9.5px sans-serif'; const wd1 = ctx.measureText(dirT + ' ').width, wsp = ctx.measureText(spT).width;
    const w = Math.ceil(Math.max(wn + 10 + ww, wd1 + wsp)) + 16, h = 36;
    items.push({ s, x, y, sp, dir, nameT, waveT, dirT, spT, wd1, w, h });
  });
  // カードの置き場所（重ならないように、近い所から順に決める）
  const placed = [];
  items.sort((a, b) => a.y - b.y).forEach(it => {
    const { x, y, w, h } = it, cs = [];
    [12, -w - 12].forEach(dx => [-h - 6, -h * .75, -h * .5, -h * .25, -4, 4, h * .2].forEach(dy => cs.push([x + dx, y + dy])));
    [[-w / 2, -h - 18], [-w / 2, 18]].forEach(([dx, dy]) => cs.push([x + dx, y + dy]));
    let best = null, bc = 1e9;
    cs.forEach(([bx, by]) => {
      const inside = bx >= 2 && bx + w <= cssW - 2 && by >= 2 && by + h <= cssH - 2;
      let pen = inside ? 0 : 500;
      if (placed.some(o => !(bx + w + 3 <= o.bx || o.bx + o.w + 3 <= bx || by + h + 3 <= o.by || o.by + o.h + 3 <= by))) pen += 1000;
      if (items.some(o => o !== it && o.x > bx - 12 && o.x < bx + w + 12 && o.y > by - 12 && o.y < by + h + 12)) pen += 800;
      if (bx < x + 6 && bx + w > x - 6 && by < y + 6 && by + h > y - 6) pen += 2000;
      const cx = bx + w / 2 - x, cy = by + h / 2 - y;
      const cost = pen + Math.hypot(cx, cy) * 0.5;
      if (cost < bc) { bc = cost; best = [bx, by]; }
    });
    it.bx = best[0]; it.by = best[1]; placed.push(it);
  });
  // 引き出し線、風の矢印、点
  items.forEach(it => {
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(it.x, it.y);
    ctx.lineTo(Math.max(it.bx, Math.min(it.x, it.bx + it.w)), Math.max(it.by, Math.min(it.y, it.by + it.h))); ctx.stroke();
    if (it.sp != null && it.dir != null) arrow(it.x, it.y, (it.dir + 180) % 360, 24, windColor(it.sp), 2.8);
    ctx.fillStyle = '#e5e7eb'; ctx.beginPath(); ctx.arc(it.x, it.y, 3.4, 0, 7); ctx.fill();
  });
  // カード（紺のすりガラス風・2行）
  items.forEach(it => {
    const { bx, by, w, h } = it;
    ctx.fillStyle = 'rgba(10,27,51,.84)'; rrect(bx, by, w, h, 9); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.38)';
    ctx.beginPath(); ctx.moveTo(bx + 9, by + .5); ctx.lineTo(bx + w - 9, by + .5); ctx.stroke();
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left'; ctx.fillStyle = '#fde68a'; ctx.font = '11px sans-serif'; ctx.fillText(it.nameT, bx + 8, by + 15);
    ctx.textAlign = 'right'; ctx.fillStyle = '#fff'; ctx.font = '15px serif'; ctx.fillText(it.waveT, bx + w - 8, by + 16);
    ctx.textAlign = 'left'; ctx.fillStyle = '#cfe0f2'; ctx.font = '9.5px sans-serif'; ctx.fillText(it.dirT, bx + 8, by + 29);
    ctx.fillStyle = it.sp != null ? windColor(it.sp) : '#94a3b8'; ctx.fillText(it.spT, bx + 8 + it.wd1, by + 29);
  });
  ctx.textAlign = 'left';
  updatePill();
}

// ---- 指の操作（1本指でずらす・2本指で拡大縮小・マウスのホイール）----
cv.style.touchAction = 'none';
const ptrs = new Map(); let g0 = null;
function startG() {
  const a = [...ptrs.values()];
  if (a.length === 1) g0 = { type: 'pan', x: a[0][0], y: a[0][1], clon: view.clon, clat: view.clat, span: view.span };
  else if (a.length >= 2) {
    const [p, q] = a, r = cv.getBoundingClientRect();
    const mx = (p[0] + q[0]) / 2 - r.left, my = (p[1] + q[1]) / 2 - r.top;
    const kx = cssW / view.span, ky = kx / COSLAT;
    g0 = { type: 'pinch', d: Math.hypot(p[0] - q[0], p[1] - q[1]) || 1, span: view.span,
      lon: view.clon + (mx - cssW / 2) / kx, lat: view.clat - (my - cssH / 2) / ky };
  } else g0 = null;
}
mw.addEventListener('pointerdown', e => {
  if (ptrs.size === 0 && e.target !== cv) return;   // 時間バーや「戻す」「現在」は、そのまま使う
  if (e.target === cv) { try { cv.setPointerCapture(e.pointerId); } catch (x) { } }
  ptrs.set(e.pointerId, [e.clientX, e.clientY]); startG();
});
mw.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId) || !g0) return;
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  const a = [...ptrs.values()];
  if (g0.type === 'pan' && a.length === 1) {
    const kx = cssW / g0.span, ky = kx / COSLAT;
    view.clon = g0.clon - (a[0][0] - g0.x) / kx; view.clat = g0.clat + (a[0][1] - g0.y) / ky;
  } else if (g0.type === 'pinch' && a.length >= 2) {
    const [p, q] = a, r = cv.getBoundingClientRect();
    const d = Math.hypot(p[0] - q[0], p[1] - q[1]) || 1;
    view.span = Math.max(SPAN_MIN, Math.min(SPAN_MAX, g0.span * g0.d / d));
    const mx = (p[0] + q[0]) / 2 - r.left, my = (p[1] + q[1]) / 2 - r.top;
    const kx = cssW / view.span, ky = kx / COSLAT;
    view.clon = g0.lon - (mx - cssW / 2) / kx; view.clat = g0.lat + (my - cssH / 2) / ky;
  }
  clampView(); schedule();
});
['pointerup', 'pointercancel'].forEach(ev => mw.addEventListener(ev, e => { ptrs.delete(e.pointerId); startG(); }));
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
  const kx0 = cssW / view.span, ky0 = kx0 / COSLAT;
  const lon = view.clon + (mx - cssW / 2) / kx0, lat = view.clat - (my - cssH / 2) / ky0;
  view.span = Math.max(SPAN_MIN, Math.min(SPAN_MAX, view.span * Math.exp(e.deltaY * 0.0015)));
  const kx = cssW / view.span, ky = kx / COSLAT;
  view.clon = lon - (mx - cssW / 2) / kx; view.clat = lat + (my - cssH / 2) / ky;
  clampView(); schedule();
}, { passive: false });
document.getElementById('fit').onclick = resetView;
window.addEventListener('resize', () => { sizeCanvas(); clampView(); schedule(); });
// ページ全体が拡大されないようにする（2本指は地図の拡大縮小だけに使う）
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault()));

// ---- 時間バー（再生を押すと時刻が出て、しばらくすると日付だけになる）----
const dock = document.getElementById('dock'), tl = document.getElementById('tl'), tin = document.getElementById('tin');
const pill = document.getElementById('pill'), playBtn = document.getElementById('play');
const STEP = 44;  // 3時間ぶんの幅(px)
let progScroll = false, collapseT = null;
function updatePill() { if (!DATA) return; pill.textContent = new Date(DATA.times[idx]).getHours() + ':00'; }
function stop() { if (timer) { clearInterval(timer); timer = null; playBtn.textContent = '▶'; } }
function setIdx(i) { idx = Math.max(0, Math.min(DATA.times.length - 1, i)); draw(); }
function expand() { dock.classList.add('open'); clearTimeout(collapseT); collapseT = setTimeout(() => dock.classList.remove('open'), 4000); }
function buildTimeline() {
  const W7 = '日月火水木金土';
  let html = '', cur = null, cnt = 0, lab = '', hrs = '';
  const flush = () => { if (cur !== null) html += `<div class="dg" style="width:${cnt * STEP}px"><div class="dl">${lab}</div><div class="hr">${hrs}</div></div>`; };
  DATA.times.forEach(t => {
    const d = new Date(t);
    if (d.getHours() % 3) return;
    const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
    if (key !== cur) { flush(); cur = key; cnt = 0; hrs = ''; lab = `${d.getDate()}(${W7[d.getDay()]})`; }
    cnt++; hrs += `<span style="width:${STEP}px">${String(d.getHours()).padStart(2, '0')}</span>`;
  });
  flush();
  tin.innerHTML = html;
}
function scrollToIdx(i) { progScroll = true; tl.scrollLeft = (i / 3) * STEP + STEP / 2; requestAnimationFrame(() => { progScroll = false; }); }
tl.addEventListener('scroll', () => {
  const c = Math.max(0, Math.min(n3 - 1, Math.round((tl.scrollLeft - STEP / 2) / STEP)));
  if (c * 3 !== idx) { if (!progScroll) stop(); setIdx(c * 3); }
}, { passive: true });
['pointerdown', 'wheel', 'touchstart'].forEach(ev => tl.addEventListener(ev, expand, { passive: true }));
tl.addEventListener('wheel', e => { if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) { e.preventDefault(); tl.scrollLeft += e.deltaY + e.deltaX; } }, { passive: false });
playBtn.onclick = () => {
  if (timer) { stop(); return; }
  playBtn.textContent = '⏸'; expand();
  timer = setInterval(() => { setIdx(idx + 3 > DATA.times.length - 1 ? nowIdx : idx + 3); scrollToIdx(idx); }, 500);
};
document.getElementById('now').onclick = () => { stop(); setIdx(nowIdx); scrollToIdx(nowIdx); expand(); };

(async function init() {
  try {
    DATA = await loadData();
    prepare();
    sizeCanvas(); resetView();
    const now = new Date(); let best = Infinity;
    DATA.times.forEach((t, i) => { if (new Date(t).getHours() % 3) return; const d = Math.abs(new Date(t) - now); if (d < best) { best = d; nowIdx = i; } });
    n3 = Math.ceil(DATA.times.length / 3);
    buildTimeline();
    setIdx(nowIdx);
    scrollToIdx(nowIdx);
  } catch (e) { document.getElementById('status').textContent = 'エラー: ' + e.message; }
})();
</script>
