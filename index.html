<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯ノ浦 波・潮・風モニター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --border-color: #334155;
            --sticky-width: 42px; /* 固定目盛列の幅 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; color: var(--text-secondary); }
        .location-note { font-size: 0.65rem; color: #64748b; margin-top: 2px; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .metric-label { font-size: 0.65rem; color: var(--text-secondary); }
        .metric-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
        .metric-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 1px; }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }

        .wind-badge {
            display: inline-block;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            margin-top: 2px;
            font-weight: 600;
        }
        .badge-offshore { background-color: #166534; color: #4ade80; }
        .badge-onshore { background-color: #991b1b; color: #fca5a5; }
        .badge-cross { background-color: #854d0e; color: #fef08a; }

        .scroll-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .selected-time-display {
            color: #f8fafc;
            font-weight: bold;
            background: #334155;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .chart-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 24px 0 10px 0;
        }

        .chart-inner {
            width: 2600px;
            position: relative;
        }

        /* 共通の固定列スタイル */
        .sticky-column {
            position: absolute;
            top: 24px;
            bottom: 0;
            width: var(--sticky-width);
            background-color: var(--card-bg);
            z-index: 10;
            display: flex;
            flex-direction: column;
            pointer-events: none;
            padding-bottom: 10px;
        }

        /* 左固定列（波高） */
        .sticky-left-column {
            left: 0;
            border-right: 1px solid var(--border-color);
        }

        /* 右固定列（潮位） */
        .sticky-right-column {
            right: 0;
            border-left: 1px solid var(--border-color);
        }

        .sticky-wave-area {
            height: 386px;
            position: relative;
            border-bottom: 1px dashed var(--border-color);
        }

        .sticky-label-wave {
            position: absolute;
            top: -18px;
            left: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--accent-wave);
            white-space: nowrap;
        }

        .sticky-label-tide {
            position: absolute;
            top: -18px;
            right: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--accent-tide);
            white-space: nowrap;
        }

        .sticky-ticks {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            font-size: 0.6rem;
            font-weight: 600;
        }

        .sticky-ticks.wave { color: var(--accent-wave); }
        .sticky-ticks.tide { color: var(--accent-tide); }

        .sticky-tick-left {
            position: absolute;
            right: 6px;
            transform: translateY(50%);
        }

        .sticky-tick-right {
            position: absolute;
            left: 6px;
            transform: translateY(50%);
        }

        .sticky-timeline-labels {
            margin-top: 6px;
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 0;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
        }

        .sticky-timeline-labels div {
            height: 20px;
            line-height: 20px;
        }

        .sticky-timeline-labels .label-wave-dir { color: var(--accent-wave); }
        .sticky-timeline-labels .label-wind-val { color: var(--accent-wind); }

        /* グラフ描画エリアとタイムラインの左右パディングを厳密に同期 */
        .canvas-container {
            height: 380px;
            position: relative;
            padding-left: var(--sticky-width);
            padding-right: var(--sticky-width);
        }

        .timeline-wrapper {
            display: flex;
            border-top: 1px dashed var(--border-color);
            margin-top: 6px;
            padding-top: 6px;
            padding-left: var(--sticky-width);
            padding-right: var(--sticky-width);
        }

        .timeline-data {
            display: flex;
            flex-grow: 1;
        }

        .timeline-col {
            flex: 1;
            text-align: center;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
            cursor: pointer;
        }

        .wave-dir-arrow {
            font-size: 0.8rem;
            color: var(--accent-wave);
            font-weight: bold;
            height: 20px;
            line-height: 20px;
        }

        .wind-val {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-wind);
            height: 20px;
            line-height: 20px;
        }

        .wind-arrow {
            font-size: 0.85rem;
            color: var(--text-primary);
            height: 20px;
            line-height: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .btn-refresh {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .last-update { font-size: 0.75rem; color: var(--text-secondary); }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            z-index: 20;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌊 磯ノ浦コンディション</h1>
        <p class="subtitle">Open-Meteo API リアルタイム連携</p>
        <p class="location-note">※ 観測地点: 北緯34.25, 東経135.08（磯ノ浦沖約1km）</p>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">波高</div>
            <div class="metric-value wave" id="currentWave">--</div>
            <div class="metric-sub" id="maxWave">本日最大 --</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">潮位</div>
            <div class="metric-value tide" id="currentTide">--</div>
            <div class="metric-sub" id="tideForecast">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">風速・風向</div>
            <div class="metric-value wind" id="currentWind">--</div>
            <div id="windTypeBadge" class="wind-badge">--</div>
        </div>
    </div>

    <div class="scroll-hint">
        <span id="selectedTimeLabel" class="selected-time-display">現在時刻を表示中</span>
        <span>👈 タップで日時選択 / 横スワイプ</span>
    </div>
    
    <div class="chart-card">
        <div id="loading" class="loading-overlay">取得中...</div>
        
        <!-- 左固定列（波高） -->
        <div class="sticky-column sticky-left-column">
            <div class="sticky-wave-area">
                <div class="sticky-label-wave">波高(m)</div>
                <div class="sticky-ticks wave" id="stickyWaveTicks"></div>
            </div>
            <div class="sticky-timeline-labels">
                <div class="label-wave-dir">波向</div>
                <div class="label-wind-val">風速</div>
                <div>風向</div>
            </div>
        </div>

        <!-- 右固定列（潮位） -->
        <div class="sticky-column sticky-right-column">
            <div class="sticky-wave-area">
                <div class="sticky-label-tide">潮位(m)</div>
                <div class="sticky-ticks tide" id="stickyTideTicks"></div>
            </div>
        </div>

        <div class="chart-scroll-wrapper">
            <div class="chart-inner">
                <div class="canvas-container">
                    <canvas id="marineChart"></canvas>
                </div>
                <div class="timeline-wrapper">
                    <div class="timeline-data" id="timelineData"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <span class="last-update" id="lastUpdate">更新: --</span>
        <button class="btn-refresh" onclick="resetToNow()">現在に戻す</button>
    </div>

    <script>
        let myChart = null;
        let globalData = null;
        let selectedIndex = 0;
        let nowIndex = 0;

        const timeLineLinesPlugin = {
            id: 'timeLineLines',
            afterDraw: (chart) => {
                const meta = chart.getDatasetMeta(0);
                if (!meta || !meta.data.length) return;
                const topY = chart.scales.yWave.top;
                const bottomY = chart.scales.yWave.bottom;
                const ctx = chart.ctx;

                // 現在地の赤点線
                if (nowIndex >= 0 && meta.data[nowIndex]) {
                    const xNow = meta.data[nowIndex].x;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(xNow, topY);
                    ctx.lineTo(xNow, bottomY);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#ef4444';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.restore();
                }

                // タップ選択された位置の青点線
                const targetIndex = chart.config.options.plugins.targetIndex;
                if (targetIndex !== undefined && targetIndex !== nowIndex && meta.data[targetIndex]) {
                    const xTarget = meta.data[targetIndex].x;
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(xTarget, topY);
                    ctx.lineTo(xTarget, bottomY);
                    ctx.lineWidth = 2;
                    ctx.strokeStyle = '#38bdf8';
                    ctx.setLineDash([4, 4]);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        };

        // 固定目盛をChart.jsのスケールと自動同期するプラグイン
        const syncStickyTicksPlugin = {
            id: 'syncStickyTicks',
            afterRender: (chart) => {
                const chartHeight = chart.height;

                // 左軸（波高）の同期
                const scaleWave = chart.scales.yWave;
                if (scaleWave) {
                    const containerWave = document.getElementById('stickyWaveTicks');
                    containerWave.innerHTML = '';
                    scaleWave.ticks.forEach(tick => {
                        const yPixel = scaleWave.getPixelForValue(tick.value);
                        const bottomPos = chartHeight - yPixel;
                        const tickDiv = document.createElement('div');
                        tickDiv.className = 'sticky-tick-left';
                        tickDiv.style.bottom = bottomPos + 'px';
                        tickDiv.textContent = tick.value.toFixed(1);
                        containerWave.appendChild(tickDiv);
                    });
                }

                // 右軸（潮位）の同期
                const scaleTide = chart.scales.yTide;
                if (scaleTide) {
                    const containerTide = document.getElementById('stickyTideTicks');
                    containerTide.innerHTML = '';
                    scaleTide.ticks.forEach(tick => {
                        const yPixel = scaleTide.getPixelForValue(tick.value);
                        const bottomPos = chartHeight - yPixel;
                        const tickDiv = document.createElement('div');
                        tickDiv.className = 'sticky-tick-right';
                        tickDiv.style.bottom = bottomPos + 'px';
                        tickDiv.textContent = tick.value.toFixed(1);
                        containerTide.appendChild(tickDiv);
                    });
                }
            }
        };

        Chart.register(timeLineLinesPlugin, syncStickyTicksPlugin);

        function getDirectionInfo(deg) {
            if (deg === null || deg === undefined) return { text: '--', arrow: '' };
            const directions = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
            const arrows = ['↓', '↙', '↙', '↙', '←', '↖', '↖', '↖', '↑', '↗', '↗', '↗', '→', '↘', '↘', '↘'];
            const index = Math.round(deg / 22.5) % 16;
            return { text: directions[index], arrow: arrows[index] };
        }

        function getWindType(deg) {
            if (deg === null || deg === undefined) return { text: '--', class: '' };
            if (deg >= 337.5 || deg <= 67.5) {
                return { text: 'オフショア (面良)', class: 'badge-offshore' };
            } else if (deg >= 157.5 && deg <= 247.5) {
                return { text: 'オンショア (面荒)', class: 'badge-onshore' };
            } else {
                return { text: 'クロス (横風)', class: 'badge-cross' };
            }
        }

        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'flex';

            const urlMarine = 'https://marine-api.open-meteo.com/v1/marine?latitude=34.25&longitude=135.08&hourly=wave_height,wave_direction,sea_level_height_msl&timezone=Asia%2FTokyo&forecast_days=3';
            const urlWeather = 'https://api.open-meteo.com/v1/forecast?latitude=34.25&longitude=135.08&hourly=wind_speed_10m,wind_direction_10m&timezone=Asia%2FTokyo&forecast_days=3';

            try {
                const [resMarine, resWeather] = await Promise.all([fetch(urlMarine), fetch(urlWeather)]);
                if (!resMarine.ok || !resWeather.ok) throw new Error('データ取得失敗');
                
                const dataMarine = await resMarine.json();
                const dataWeather = await resWeather.json();

                globalData = {
                    times: dataMarine.hourly.time,
                    waveHeights: dataMarine.hourly.wave_height,
                    waveDirections: dataMarine.hourly.wave_direction,
                    seaLevels: dataMarine.hourly.sea_level_height_msl,
                    windSpeeds: dataWeather.hourly.wind_speed_10m.map(v => v !== null ? (v / 3.6).toFixed(1) : null),
                    windDirections: dataWeather.hourly.wind_direction_10m
                };

                const now = new Date();
                let minDiff = Infinity;
                globalData.times.forEach((t, i) => {
                    const diff = Math.abs(new Date(t) - now);
                    if (diff < minDiff) {
                        minDiff = diff;
                        nowIndex = i;
                    }
                });

                selectedIndex = nowIndex;
                renderAll();

                document.getElementById('lastUpdate').textContent = '更新: ' + now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            } catch (error) {
                alert('エラー: ' + error.message);
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        function updateMetricsCards(index) {
            const t = new Date(globalData.times[index]);
            const month = t.getMonth() + 1;
            const date = t.getDate();
            const hours = t.getHours().toString().padStart(2, '0');

            const labelEl = document.getElementById('selectedTimeLabel');
            if (index === nowIndex) {
                labelEl.textContent = '現在時刻を表示中';
                labelEl.style.background = '#334155';
            } else {
                labelEl.textContent = `${month}/${date} ${hours}:00 の予測`;
                labelEl.style.background = '#0284c7';
            }

            const curWave = globalData.waveHeights[index] !== null ? globalData.waveHeights[index].toFixed(2) : '--';
            const curTide = globalData.seaLevels[index] !== null ? globalData.seaLevels[index].toFixed(2) : '--';
            const curWindSpeed = globalData.windSpeeds[index] !== null ? globalData.windSpeeds[index] : '--';
            const curWindDirDeg = globalData.windDirections[index];
            const windType = getWindType(curWindDirDeg);

            const todayWaveHeights = globalData.waveHeights.slice(0, 24).filter(v => v !== null);
            const maxWaveVal = todayWaveHeights.length > 0 ? Math.max(...todayWaveHeights).toFixed(2) : '--';

            let tideNotice = '高度 ' + curTide + 'm';
            if (index + 1 < globalData.seaLevels.length) {
                const isRising = globalData.seaLevels[index + 1] > globalData.seaLevels[index];
                tideNotice = isRising ? '上げ潮傾向' : '下げ潮傾向';
            }

            document.getElementById('currentWave').textContent = curWave + 'm';
            document.getElementById('maxWave').textContent = '本日最大 ' + maxWaveVal + 'm';
            document.getElementById('currentTide').textContent = curTide + 'm';
            document.getElementById('tideForecast').textContent = tideNotice;
            document.getElementById('currentWind').textContent = curWindSpeed + 'm/s';
            
            const badgeEl = document.getElementById('windTypeBadge');
            badgeEl.textContent = windType.text;
            badgeEl.className = 'wind-badge ' + windType.class;
        }

        function resetToNow() {
            if (!globalData) {
                fetchData();
                return;
            }
            selectedIndex = nowIndex;
            renderAll();
        }

        function selectIndex(index) {
            selectedIndex = index;
            updateMetricsCards(selectedIndex);
            if (myChart) {
                myChart.config.options.plugins.targetIndex = selectedIndex;
                myChart.update();
            }
        }

        function renderAll() {
            const labels = globalData.times.map(t => {
                const d = new Date(t);
                const month = d.getMonth() + 1;
                const date = d.getDate();
                const hours = d.getHours();
                return hours === 0 ? `${month}/${date}` : `${hours}`;
            });

            updateMetricsCards(selectedIndex);
            renderChart(labels, globalData.times, globalData.waveHeights, globalData.seaLevels);
            renderTimeline(globalData.waveDirections, globalData.windSpeeds, globalData.windDirections);
        }

        function renderChart(labels, rawTimes, waveData, tideData) {
            const ctx = document.getElementById('marineChart').getContext('2d');
            if (myChart) myChart.destroy();

            const maxWaveVal = Math.max(...waveData.filter(v => v !== null), 0);
            const targetMaxWave = maxWaveVal > 2.0 ? Math.ceil(maxWaveVal * 1.1 * 10) / 10 : 2.0;

            const validTide = tideData.filter(v => v !== null);
            const minTide = validTide.length ? Math.floor(Math.min(...validTide) * 10) / 10 : -0.5;
            const maxTide = validTide.length ? Math.ceil(Math.max(...validTide) * 10) / 10 : 1.5;

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '波高 (m)',
                            data: waveData,
                            backgroundColor: 'rgba(56, 189, 248, 0.85)',
                            borderColor: '#38bdf8',
                            borderWidth: 1,
                            yAxisID: 'yWave',
                            order: 2
                        },
                        {
                            type: 'line',
                            label: '潮位 (m)',
                            data: tideData,
                            borderColor: '#fb923c',
                            backgroundColor: 'rgba(251, 146, 60, 0.2)',
                            borderWidth: 2.5,
                            pointRadius: 0,
                            pointHoverRadius: 4,
                            tension: 0.4,
                            yAxisID: 'yTide',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: {
                        padding: { left: 0, right: 0, top: 10, bottom: 0 }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            callbacks: {
                                title: (items) => {
                                    if (!items.length) return '';
                                    const idx = items[0].dataIndex;
                                    const d = new Date(rawTimes[idx]);
                                    return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:00`;
                                }
                            }
                        },
                        targetIndex: selectedIndex
                    },
                    onClick: (e, elements) => {
                        if (elements.length > 0) {
                            selectIndex(elements[0].index);
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(51, 65, 85, 0.4)' },
                            ticks: {
                                color: (ctx) => (rawTimes[ctx.index] && new Date(rawTimes[ctx.index]).getHours() % 3 === 0) ? '#f8fafc' : '#64748b',
                                font: (ctx) => ({
                                    weight: (rawTimes[ctx.index] && new Date(rawTimes[ctx.index]).getHours() % 3 === 0) ? 'bold' : 'normal',
                                    size: 11
                                })
                            }
                        },
                        yWave: {
                            type: 'linear',
                            position: 'left',
                            min: 0,
                            max: targetMaxWave,
                            display: false // JSで描画をオフにし固定列へ集約
                        },
                        yTide: {
                            type: 'linear',
                            position: 'right',
                            min: minTide,
                            max: maxTide,
                            display: false // JSで描画をオフにし固定列へ集約
                        }
                    }
                }
            });
        }

        function renderTimeline(waveDirs, windSpeeds, windDirs) {
            const container = document.getElementById('timelineData');
            container.innerHTML = '';

            waveDirs.forEach((wDeg, i) => {
                const col = document.createElement('div');
                col.className = 'timeline-col';
                col.onclick = () => selectIndex(i);

                const waveInfo = getDirectionInfo(wDeg);
                const windInfo = getDirectionInfo(windDirs[i]);
                const speed = windSpeeds[i] !== null ? windSpeeds[i] : '--';

                col.innerHTML = `
                    <div class="wave-dir-arrow" title="${waveInfo.text}">${waveInfo.arrow}</div>
                    <div class="wind-val">${speed}</div>
                    <div class="wind-arrow" title="${windInfo.text}">${windInfo.arrow}</div>
                `;
                container.appendChild(col);
            });
        }

        fetchData();
    </script>
</body>
</html>
