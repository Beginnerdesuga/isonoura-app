<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯ノ浦 波・潮・風モニター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; color: var(--text-secondary); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .metric-label { font-size: 0.65rem; color: var(--text-secondary); }
        .metric-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
        .metric-sub { font-size: 0.7rem; color: var(--text-secondary); margin-top: 1px; }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }

        .scroll-hint {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: right;
            margin-bottom: 4px;
        }

        .chart-scroll-wrapper {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 6px;
            position: relative;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chart-inner {
            width: 2000px;
            position: relative;
        }

        .canvas-container {
            height: 300px;
            position: relative;
        }

        /* 風予報タイムライン */
        .wind-timeline {
            display: flex;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            margin-top: 4px;
            padding-left: 45px; /* Y軸のマージン調整 */
            padding-right: 45px;
        }

        .wind-col {
            flex: 1;
            text-align: center;
            min-width: 0;
        }

        .wind-val {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-wind);
        }

        .wind-arrow {
            font-size: 0.85rem;
            margin-top: 1px;
            color: var(--text-primary);
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .btn-refresh {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .last-update { font-size: 0.75rem; color: var(--text-secondary); }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌊 磯ノ浦コンディション</h1>
        <p class="subtitle">Open-Meteo API リアルタイム連携</p>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">波高</div>
            <div class="metric-value wave" id="currentWave">--</div>
            <div class="metric-sub" id="maxWave">本日最大 --</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">潮位</div>
            <div class="metric-value tide" id="currentTide">--</div>
            <div class="metric-sub">海面高度</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">風速・風向</div>
            <div class="metric-value wind" id="currentWind">--</div>
            <div class="metric-sub" id="currentWindDir">--</div>
        </div>
    </div>

    <div class="scroll-hint">👈 横スワイプで先時間の波・潮・風を表示</div>
    <div class="chart-scroll-wrapper">
        <div id="loading" class="loading-overlay">取得中...</div>
        <div class="chart-inner">
            <div class="canvas-container">
                <canvas id="marineChart"></canvas>
            </div>
            <div class="wind-timeline" id="windTimeline"></div>
        </div>
    </div>

    <div class="controls">
        <span class="last-update" id="lastUpdate">更新: --</span>
        <button class="btn-refresh" onclick="fetchData()">更新</button>
    </div>

    <script>
        let myChart = null;

        function getWindDirection(deg) {
            const directions = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
            const arrows = ['↓', '↙', '↙', '↙', '←', '↖', '↖', '↖', '↑', '↗', '↗', '↗', '→', '↘', '↘', '↘'];
            const index = Math.round(deg / 22.5) % 16;
            return { text: directions[index], arrow: arrows[index] };
        }

        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'flex';

            const urlMarine = 'https://marine-api.open-meteo.com/v1/marine?latitude=34.25&longitude=135.08&hourly=wave_height,sea_level_height_msl&timezone=Asia%2FTokyo&forecast_days=3';
            const urlWeather = 'https://api.open-meteo.com/v1/forecast?latitude=34.25&longitude=135.08&hourly=wind_speed_10m,wind_direction_10m&timezone=Asia%2FTokyo&forecast_days=3';

            try {
                const [resMarine, resWeather] = await Promise.all([fetch(urlMarine), fetch(urlWeather)]);
                if (!resMarine.ok || !resWeather.ok) throw new Error('データ取得失敗');
                
                const dataMarine = await resMarine.json();
                const dataWeather = await resWeather.json();

                processAndRender(dataMarine, dataWeather);

                const now = new Date();
                document.getElementById('lastUpdate').textContent = '更新: ' + now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            } catch (error) {
                alert('エラー: ' + error.message);
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        function processAndRender(marine, weather) {
            const times = marine.hourly.time;
            const waveHeights = marine.hourly.wave_height;
            const seaLevels = marine.hourly.sea_level_height_msl;
            const windSpeeds = weather.hourly.wind_speed_10m.map(v => v !== null ? (v / 3.6).toFixed(1) : null);
            const windDirections = weather.hourly.wind_direction_10m;

            const labels = times.map(t => {
                const d = new Date(t);
                const date = String(d.getDate()).padStart(2, '0');
                const hours = String(d.getHours()).padStart(2, '0');
                return `${date}日 ${hours}:00`;
            });

            // 現在時刻のインデックスを取得
            const now = new Date();
            let currentIndex = 0;
            let minDiff = Infinity;
            times.forEach((t, i) => {
                const diff = Math.abs(new Date(t) - now);
                if (diff < minDiff) {
                    minDiff = diff;
                    currentIndex = i;
                }
            });

            // 上部カードの更新
            const curWave = waveHeights[currentIndex] !== null ? waveHeights[currentIndex].toFixed(2) : '--';
            const curTide = seaLevels[currentIndex] !== null ? seaLevels[currentIndex].toFixed(2) : '--';
            const curWindSpeed = windSpeeds[currentIndex] !== null ? windSpeeds[currentIndex] : '--';
            const curWindDirDeg = windDirections[currentIndex];
            const windInfo = curWindDirDeg !== null ? getWindDirection(curWindDirDeg) : { text: '--', arrow: '' };
            
            const todayWaveHeights = waveHeights.slice(0, 24).filter(v => v !== null);
            const maxWaveVal = todayWaveHeights.length > 0 ? Math.max(...todayWaveHeights).toFixed(2) : '--';

            document.getElementById('currentWave').textContent = curWave + 'm';
            document.getElementById('maxWave').textContent = '本日最大 ' + maxWaveVal + 'm';
            document.getElementById('currentTide').textContent = curTide + 'm';
            document.getElementById('currentWind').textContent = curWindSpeed + 'm/s';
            document.getElementById('currentWindDir').textContent = `${windInfo.arrow} (${windInfo.text})`;

            // グラフ描画
            renderChart(labels, waveHeights, seaLevels);

            // グラフ直下の風予報タイムライン生成
            renderWindTimeline(windSpeeds, windDirections);
        }

        function renderChart(labels, waveData, tideData) {
            const ctx = document.getElementById('marineChart').getContext('2d');
            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '波高 (m)',
                            data: waveData,
                            backgroundColor: 'rgba(56, 189, 248, 0.65)',
                            borderColor: '#38bdf8',
                            borderWidth: 1,
                            yAxisID: 'yWave',
                            order: 2
                        },
                        {
                            label: '潮位 (m)',
                            data: tideData,
                            type: 'line',
                            borderColor: '#fb923c',
                            borderWidth: 2.5,
                            tension: 0.4,
                            pointRadius: 0,
                            yAxisID: 'yTide',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#f8fafc', boxWidth: 12, font: { size: 11 } } }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#94a3b8', maxRotation: 0, autoSkip: false },
                            grid: { color: 'rgba(51, 65, 85, 0.3)' }
                        },
                        yWave: {
                            type: 'linear',
                            position: 'left',
                            title: { display: true, text: '波高(m)', color: '#38bdf8' },
                            ticks: { color: '#38bdf8' },
                            grid: { color: 'rgba(51, 65, 85, 0.3)' },
                            beginAtZero: true,
                            suggestedMax: 2.0
                        },
                        yTide: {
                            type: 'linear',
                            position: 'right',
                            title: { display: true, text: '潮位(m)', color: '#fb923c' },
                            ticks: { color: '#fb923c' },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        function renderWindTimeline(speeds, directions) {
            const container = document.getElementById('windTimeline');
            container.innerHTML = '';

            speeds.forEach((speed, i) => {
                const dirDeg = directions[i];
                const info = dirDeg !== null ? getWindDirection(dirDeg) : { arrow: '' };

                const col = document.createElement('div');
                col.className = 'wind-col';
                col.innerHTML = `
                    <div class="wind-val">${speed !== null ? speed : '--'}</div>
                    <div class="wind-arrow">${info.arrow}</div>
                `;
                container.appendChild(col);
            });
        }

        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
