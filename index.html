<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯の浦 波・潮・風モニター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --accent-weather: #facc15;
            --border-color: #334155;
            --sticky-width: 42px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; color: var(--text-secondary); }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .metric-label { font-size: 0.65rem; color: var(--text-secondary); }
        .metric-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
        .metric-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 1px; }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }
        .metric-value.weather { color: var(--accent-weather); font-size: 1.1rem; }

        .scroll-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .selected-time-display {
            color: #f8fafc;
            font-weight: bold;
            background: #334155;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .chart-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chart-container {
            position: relative;
            height: 320px;
            min-width: 800px;
        }
    </style>
</head>
<body>

    <header>
        <h1>磯の浦 波・潮・風モニター</h1>
        <div class="subtitle">和歌山市磯の浦 沿岸データ</div>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">波高</div>
            <div class="metric-value wave" id="val-wave">--</div>
            <div class="metric-sub" id="val-wave-period">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">潮位</div>
            <div class="metric-value tide" id="val-tide">--</div>
            <div class="metric-sub" id="val-tide-state">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">風速</div>
            <div class="metric-value wind" id="val-wind">--</div>
            <div class="metric-sub" id="val-wind-dir">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">天気</div>
            <div class="metric-value weather" id="val-weather">--</div>
            <div class="metric-sub" id="val-weather-text">--</div>
        </div>
    </div>

    <div class="scroll-hint">
        <span>タップした時間帯のデータを表示</span>
        <span class="selected-time-display" id="selected-time">--:--</span>
    </div>

    <div class="chart-card">
        <div class="chart-scroll-wrapper">
            <div class="chart-container">
                <canvas id="forecastChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        function getWeatherInfo(code) {
            if (code === 0) return { icon: '☀️', text: '快晴' };
            if (code === 1 || code === 2) return { icon: '🌤️', text: '晴れ' };
            if (code === 3) return { icon: '☁️', text: 'くもり' };
            if (code >= 45 && code <= 48) return { icon: '🌫️', text: '霧' };
            if (code >= 51 && code <= 55) return { icon: '🌧️', text: '霧雨' };
            if (code >= 61 && code <= 65) return { icon: '☔', text: '雨' };
            if (code >= 80 && code <= 82) return { icon: '🌧️', text: 'にわか雨' };
            if (code >= 95) return { icon: '⚡', text: '雷雨' };
            return { icon: '☁️', text: '不明' };
        }

        let combinedData = [];

        async function fetchAndMergeData() {
            try {
                const [weatherRes, marineRes] = await Promise.all([
                    fetch('https://api.open-meteo.com/v1/forecast?latitude=34.25&longitude=135.08&hourly=wind_speed_10m,wind_direction_10m,weather_code&timezone=Asia%2FTokyo'),
                    fetch('https://marine-api.open-meteo.com/v1/forecast?latitude=34.25&longitude=135.08&hourly=wave_height,wave_period&timezone=Asia%2FTokyo')
                ]);

                const weather = await weatherRes.json();
                const marine = await marineRes.json();

                // 海洋データの時間をキーにしたマップを作成
                const marineMap = new Map();
                if (marine.hourly && marine.hourly.time) {
                    marine.hourly.time.forEach((t, i) => {
                        marineMap.set(t, {
                            wave_height: marine.hourly.wave_height ? marine.hourly.wave_height[i] : null,
                            wave_period: marine.hourly.wave_period ? marine.hourly.wave_period[i] : null
                        });
                    });
                }

                // 気象データの時間軸をベースに1時間ずつ正確に統合
                combinedData = weather.hourly.time.map((t, i) => {
                    const m = marineMap.get(t) || { wave_height: null, wave_period: null };
                    return {
                        time: t,
                        displayTime: t.substring(11, 16),
                        wind_speed: weather.hourly.wind_speed_10m[i],
                        wind_dir: weather.hourly.wind_direction_10m[i],
                        weather_code: weather.hourly.weather_code[i],
                        wave_height: m.wave_height,
                        wave_period: m.wave_period
                    };
                });

                return true;
            } catch (e) {
                console.error("データ統合エラー:", e);
                return false;
            }
        }

        function updateCards(index) {
            const item = combinedData[index];
            if (!item) return;

            document.getElementById('selected-time').innerText = item.displayTime;

            // 波
            const wave = item.wave_height !== null && item.wave_height !== undefined ? item.wave_height + 'm' : '--';
            const period = item.wave_period !== null && item.wave_period !== undefined ? item.wave_period + 's' : '--';
            document.getElementById('val-wave').innerText = wave;
            document.getElementById('val-wave-period').innerText = period;

            // 潮 (固定表示部)
            document.getElementById('val-tide').innerText = '120cm';
            document.getElementById('val-tide-state').innerText = '中潮';

            // 風
            const wind = item.wind_speed !== null && item.wind_speed !== undefined ? item.wind_speed + 'm/s' : '--';
            const windDir = item.wind_dir !== null && item.wind_dir !== undefined ? item.wind_dir + '°' : '--';
            document.getElementById('val-wind').innerText = wind;
            document.getElementById('val-wind-dir').innerText = windDir;

            // 天気 (時間帯連動)
            const weatherInfo = getWeatherInfo(item.weather_code);
            document.getElementById('val-weather').innerText = weatherInfo.icon;
            document.getElementById('val-weather-text').innerText = weatherInfo.text;
        }

        async function init() {
            const success = await fetchAndMergeData();
            if (!success || combinedData.length === 0) return;

            const labels = combinedData.map(d => d.displayTime);
            const waveData = combinedData.map(d => d.wave_height);

            const ctx = document.getElementById('forecastChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '波高 (m)',
                        data: waveData,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.2)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (e, activeElements) => {
                        if (activeElements.length > 0) {
                            const index = activeElements[0].index;
                            updateCards(index);
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#94a3b8' },
                            grid: { color: '#334155' }
                        },
                        y: {
                            ticks: { color: '#94a3b8' },
                            grid: { color: '#334155' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // 初期表示は先頭（最初の時間帯）に設定
            updateCards(0);
        }

        window.onload = init;
    </script>
</body>
</html>
