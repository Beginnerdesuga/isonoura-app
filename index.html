<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>磯ノ浦 海況ダッシュボード</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: sans-serif;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      color: #f8fafc;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }
    .metric-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 15px;
    }
    .metric-title {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .metric-value {
      font-size: 1.6rem;
      font-weight: bold;
      margin: 8px 0;
    }
    .metric-sub {
      font-size: 0.75rem;
      color: #64748b;
    }
    .chart-container {
      position: relative;
      height: 300px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>磯ノ浦 リアルタイム海況データ</h1>
    </div>

    <div class="grid">
      <div class="metric-card">
        <div class="metric-title">波高</div>
        <div class="metric-value">0.8 m</div>
        <div class="metric-sub">セット腰〜腹</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">風速・風向</div>
        <div class="metric-value">2.4 m/s</div>
        <div class="metric-sub">北東 (オフショア)</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">潮位</div>
        <div class="metric-value">142 cm</div>
        <div class="metric-sub">中潮</div>
      </div>
      <div class="metric-card">
        <div class="metric-title">水温</div>
        <div class="metric-value">22.5 °C</div>
        <div class="metric-sub">測定値</div>
      </div>
    </div>

    <div class="card">
      <div class="chart-container">
        <canvas id="seaChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('seaChart').getContext('2d');
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['00:00', '02:00', '04:00', '06:00', '08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00'],
        datasets: [
          {
            type: 'bar',
            label: '波高 (m)',
            data: [0.4, 0.4, 0.5, 0.8, 0.9, 0.7, 0.6, 0.5, 0.7, 0.8, 0.6, 0.5],
            backgroundColor: '#38bdf8',
            borderRadius: 4
          },
          {
            type: 'line',
            label: '風速 (m/s)',
            data: [1.2, 1.5, 1.8, 2.4, 3.1, 4.0, 4.5, 3.8, 2.9, 2.1, 1.8, 1.4],
            borderColor: '#f59e0b',
            borderWidth: 2,
            fill: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          x: {
            ticks: { color: '#94a3b8' },
            grid: { color: '#334155' }
          },
          y: {
            ticks: { color: '#94a3b8' },
            grid: { color: '#334155' },
            beginAtZero: true
          }
        },
        plugins: {
          legend: {
            labels: { color: '#94a3b8' }
          }
        }
      }
    });
  </script>
</body>
</html>
