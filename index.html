<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯の浦 波・潮・風モニター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --accent-weather: #facc15;
            --border-color: #334155;
            --sticky-width: 42px; /* 固定目盛列の幅 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; color: var(--text-secondary); }
        .location-note { font-size: 0.65rem; color: #64748b; margin-top: 2px; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .metric-label { font-size: 0.65rem; color: var(--text-secondary); }
        .metric-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
        .metric-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 1px; }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }
        .metric-value.weather { color: var(--accent-weather); font-size: 1.1rem; }

        .wind-badge {
            display: inline-block;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            margin-top: 2px;
            font-weight: 600;
        }
        .badge-offshore { background-color: #166534; color: #4ade80; }
        .badge-onshore { background-color: #991b1b; color: #fca5a5; }
        .badge-cross { background-color: #854d0e; color: #fef08a; }

        .scroll-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .selected-time-display {
            color: #f8fafc;
            font-weight: bold;
            background: #334155;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .chart-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chart-container {
            position: relative;
            height: 320px;
            min-width: 800px;
        }
    </style>
</head>
<body>

    <header>
        <h1>磯の浦 波・潮・風モニター</h1>
        <div class="subtitle">和歌山市磯の浦 沿岸データ</div>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">波高</div>
            <div class="metric-value wave" id="val-wave">--</div>
            <div class="metric-sub" id="val-wave-period">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">潮位</div>
            <div class="metric-value tide" id="val-tide">--</div>
            <div class="metric-sub" id="val-tide-state">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">風速</div>
            <div class="metric-value wind" id="val-wind">--</div>
            <div class="metric-sub" id="val-wind-dir">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">天気</div>
            <div class="metric-value weather" id="val-weather">--</div>
            <div class="metric-sub" id="val-weather-text">--</div>
        </div>
    </div>

    <div class="scroll-hint">
        <span>タップした時間帯のデータを表示</span>
        <span class="selected-time-display" id="selected-time">--:--</span>
    </div>

    <div class="chart-card">
        <div class="chart-scroll-wrapper">
            <div class="chart-container">
                <canvas id="forecastChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // 天気コードから表示マーク(静止画絵文字)とテキストを取得するマップ
        function getWeatherInfo(code) {
            if (code === 0) return { icon: '☀️', text: '快晴' };
            if (code === 1 || code === 2) return { icon: '🌤️', text: '晴れ' };
            if (code === 3) return { icon: '☁️', text: 'くもり' };
            if (code >= 45 && code <= 48) return { icon: '🌫️', text: '霧' };
            if (code >= 51 && code <= 55) return { icon: '🌧️', text: '霧雨' };
            if (code >= 61 && code <= 65) return { icon: '☔', text: '雨' };
            if (code >= 80 && code <= 82) return { icon: '🌧️', text: 'にわか雨' };
            if (code >= 95) return { icon: '⚡', text: '雷雨' };
            return { icon: '☁️', text: '不明' };
        }

        // Open-Meteo API (磯の浦: 緯度 34.25, 経度 135.08) から天気データとあわせて取得する例
        async function fetchForecastData() {
            try {
                const response = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.25&longitude=135.08&hourly=wave_height,wave_period,wind_speed_10m,wind_direction_10m,weather_code&timezone=Asia%2FTokyo');
                const data = await response.json();
                return data.hourly;
            } catch (e) {
                console.error("データ取得エラー", e);
                return null;
            }
        }

        let chartInstance = null;
        let hourlyData = null;

        function updateCards(index) {
            if (!hourlyData) return;

            // 時間
            const timeStr = hourlyData.time[index] ? hourlyData.time[index].substring(11, 16) : '--:--';
            document.getElementById('selected-time').innerText = timeStr;

            // 波
            const wave = hourlyData.wave_height ? hourlyData.wave_height[index] : '--';
            const period = hourlyData.wave_period ? hourlyData.wave_period[index] : '--';
            document.getElementById('val-wave').innerText = wave !== '--' ? wave + 'm' : '--';
            document.getElementById('val-wave-period').innerText = period !== '--' ? period + 's' : '--';

            // 潮 (仮値/計算値)
            document.getElementById('val-tide').innerText = '120cm';
            document.getElementById('val-tide-state').innerText = '中潮';

            // 風
            const wind = hourlyData.wind_speed_10m ? hourlyData.wind_speed_10m[index] : '--';
            const windDir = hourlyData.wind_direction_10m ? hourlyData.wind_direction_10m[index] : '--';
            document.getElementById('val-wind').innerText = wind !== '--' ? wind + 'm/s' : '--';
            document.getElementById('val-wind-dir').innerText = windDir !== '--' ? windDir + '°' : '--';

            // 天気 (グラフタップ連動)
            const weatherCode = hourlyData.weather_code ? hourlyData.weather_code[index] : -1;
            const weatherInfo = getWeatherInfo(weatherCode);
            document.getElementById('val-weather').innerText = weatherInfo.icon;
            document.getElementById('val-weather-text').innerText = weatherInfo.text;
        }

        async function init() {
            const data = await fetchForecastData();
            if (!data) return;

            hourlyData = data;
            const labels = data.time.map(t => t.substring(11, 16));

            const ctx = document.getElementById('forecastChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '波高 (m)',
                        data: data.wave_height || [],
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.2)',
                        tension: 0.3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (e, activeElements) => {
                        if (activeElements.length > 0) {
                            const index = activeElements[0].index;
                            updateCards(index);
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: '#94a3b8' },
                            grid: { color: '#334155' }
                        },
                        y: {
                            ticks: { color: '#94a3b8' },
                            grid: { color: '#334155' }
                        }
                    },
                    plugins: {
                        legend: { display: false }
                    }
                }
            });

            // 初期表示（最初の時間帯のデータ）
            updateCards(0);
        }

        window.onload = init;
    </script>
</body>
</html>
