<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯ノ浦 波・潮・風モニター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; color: var(--text-secondary); }
        .location-note { font-size: 0.65rem; color: #64748b; margin-top: 2px; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .metric-label { font-size: 0.65rem; color: var(--text-secondary); }
        .metric-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
        .metric-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 1px; }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }

        .wind-badge {
            display: inline-block;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            margin-top: 2px;
            font-weight: 600;
        }
        .badge-offshore { background-color: #166534; color: #4ade80; }
        .badge-onshore { background-color: #991b1b; color: #fca5a5; }
        .badge-cross { background-color: #854d0e; color: #fef08a; }

        .scroll-hint {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: right;
            margin-bottom: 4px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .chart-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 24px 0 10px 0; /* ラベル退避用に上部余白を確保 */
        }

        .chart-inner {
            width: 2600px;
            position: relative;
        }

        /* 左側完全固定列 */
        .sticky-left-column {
            position: absolute;
            left: 0;
            top: 24px; /* 上部余白と合わせる */
            bottom: 0;
            width: 60px; /* 目盛りと被らない60pxに拡幅 */
            background-color: var(--card-bg);
            z-index: 10;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            pointer-events: none;
            padding-bottom: 10px;
        }

        .sticky-wave-area {
            height: 386px; /* 380px(グラフ) + 6px(余白) で右点線とピッタリ同期 */
            position: relative;
            border-bottom: 1px dashed var(--border-color);
        }

        /* 波高(m)ラベルを枠上の外側に完全退避 */
        .sticky-label-wave {
            position: absolute;
            top: -18px;
            left: 6px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--accent-wave);
            white-space: nowrap;
            z-index: 10;
        }

        /* 固定目盛り数値エリア */
        .sticky-wave-ticks {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            font-size: 0.6rem;
            color: var(--accent-wave);
            font-weight: 600;
        }

        .sticky-tick {
            position: absolute;
            right: 8px;
            transform: translateY(50%);
        }

        .sticky-timeline-labels {
            margin-top: 6px;
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 0;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
        }

        .sticky-timeline-labels div {
            height: 20px;
            line-height: 20px;
        }

        .sticky-timeline-labels .label-wave-dir { color: var(--accent-wave); }
        .sticky-timeline-labels .label-wind-val { color: var(--accent-wind); }

        .canvas-container {
            height: 380px; /* グラフ高さを380pxに引き伸ばし */
            position: relative;
            padding-left: 60px; /* 固定幅に合わせて左余白を変更 */
        }

        .timeline-wrapper {
            display: flex;
            border-top: 1px dashed var(--border-color);
            margin-top: 6px;
            padding-top: 6px;
            padding-left: 60px;
        }

        .timeline-data {
            display: flex;
            flex-grow: 1;
            padding-right: 40px;
        }

        .timeline-col {
            flex: 1;
            text-align: center;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .wave-dir-arrow {
            font-size: 0.8rem;
            color: var(--accent-wave);
            font-weight: bold;
            height: 20px;
            line-height: 20px;
        }

        .wind-val {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-wind);
            height: 20px;
            line-height: 20px;
        }

        .wind-arrow {
            font-size: 0.85rem;
            color: var(--text-primary);
            height: 20px;
            line-height: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .btn-refresh {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .last-update { font-size: 0.75rem; color: var(--text-secondary); }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            z-index: 20;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌊 磯ノ浦コンディション</h1>
        <p class="subtitle">Open-Meteo API リアルタイム連携</p>
        <p class="location-note">※ 観測地点: 北緯34.25, 東経135.08（磯ノ浦沖約1km）</p>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">波高</div>
            <div class="metric-value wave" id="currentWave">--</div>
            <div class="metric-sub" id="maxWave">本日最大 --</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">潮位</div>
            <div class="metric-value tide" id="currentTide">--</div>
            <div class="metric-sub" id="tideForecast">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">風速・風向</div>
            <div class="metric-value wind" id="currentWind">--</div>
            <div id="windTypeBadge" class="wind-badge">--</div>
        </div>
    </div>

    <div class="scroll-hint">👈 横スワイプで先時間の波・潮・風を表示</div>
    
    <div class="chart-card">
        <div id="loading" class="loading-overlay">取得中...</div>
        
        <div class="sticky-left-column">
            <div class="sticky-wave-area">
                <div class="sticky-label-wave">波高(m)</div>
                <div class="sticky-wave-ticks" id="stickyWaveTicks"></div>
            </div>
            <div class="sticky-timeline-labels">
                <div class="label-wave-dir">波向</div>
                <div class="label-wind-val">風速</div>
                <div>風向</div>
            </div>
        </div>

        <div class="chart-scroll-wrapper">
            <div class="chart-inner">
                <div class="canvas-container">
                    <canvas id="marineChart"></canvas>
                </div>
                <div class="timeline-wrapper">
                    <div class="timeline-data" id="timelineData"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <span class="last-update" id="lastUpdate">更新: --</span>
        <button class="btn-refresh" onclick="fetchData()">更新</button>
    </div>

    <script>
        let myChart = null;

        const currentTimeLinePlugin = {
            id: 'currentTimeLine',
            afterDraw: (chart) => {
                const currentIndex = chart.config.options.plugins.currentTimeLineIndex;
                if (currentIndex === undefined || currentIndex < 0) return;

                const meta = chart.getDatasetMeta(0);
                if (!meta.data[currentIndex]) return;

                const x = meta.data[currentIndex].x;
                const topY = chart.scales.yWave.top;
                const bottomY = chart.scales.yWave.bottom;

                const ctx = chart.ctx;
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(x, topY);
                ctx.lineTo(x, bottomY);
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#ef4444';
                ctx.setLineDash([4, 4]);
                ctx.stroke();
                ctx.restore();
            }
        };

        // 固定目盛りの同期プラグイン（yWave軸の描画位置と位置修正を同期）
        const syncStickyTicksPlugin = {
            id: 'syncStickyTicks',
            afterRender: (chart) => {
                const scale = chart.scales.yWave;
                if (!scale) return;

                const container = document.getElementById('stickyWaveTicks');
                container.innerHTML = '';

                const ticks = scale.ticks;
                const chartHeight = chart.height;

                ticks.forEach(tick => {
                    const yPixel = scale.getPixelForValue(tick.value);
                    const bottomPos = chartHeight - yPixel;

                    const tickDiv = document.createElement('div');
                    tickDiv.className = 'sticky-tick';
                    tickDiv.style.bottom = bottomPos + 'px';
                    tickDiv.textContent = tick.value.toFixed(1);
                    container.appendChild(tickDiv);
                });
            }
        };

        Chart.register(currentTimeLinePlugin, syncStickyTicksPlugin);

        function getDirectionInfo(deg) {
            if (deg === null || deg === undefined) return { text: '--', arrow: '' };
            const directions = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
            const arrows = ['↓', '↙', '↙', '↙', '←', '↖', '↖', '↖', '↑', '↗', '↗', '↗', '→', '↘', '↘', '↘'];
            const index = Math.round(deg / 22.5) % 16;
            return { text: directions[index], arrow: arrows[index] };
        }

        function getWindType(deg) {
            if (deg === null || deg === undefined) return { text: '--', class: '' };
            if (deg >= 337.5 || deg <= 67.5) {
                return { text: 'オフショア (面良)', class: 'badge-offshore' };
            } else if (deg >= 157.5 && deg <= 247.5) {
                return { text: 'オンショア (面荒)', class: 'badge-onshore' };
            } else {
                return { text: 'クロス (横風)', class: 'badge-cross' };
            }
        }

        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            loadingEl.style.display = 'flex';

            const urlMarine = 'https://marine-api.open-meteo.com/v1/marine?latitude=34.25&longitude=135.08&hourly=wave_height,wave_direction,sea_level_height_msl&timezone=Asia%2FTokyo&forecast_days=3';
            const urlWeather = 'https://api.open-meteo.com/v1/forecast?latitude=34.25&longitude=135.08&hourly=wind_speed_10m,wind_direction_10m&timezone=Asia%2FTokyo&forecast_days=3';

            try {
                const [resMarine, resWeather] = await Promise.all([fetch(urlMarine), fetch(urlWeather)]);
                if (!resMarine.ok || !resWeather.ok) throw new Error('データ取得失敗');
                
                const dataMarine = await resMarine.json();
                const dataWeather = await resWeather.json();

                processAndRender(dataMarine, dataWeather);

                const now = new Date();
                document.getElementById('lastUpdate').textContent = '更新: ' + now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            } catch (error) {
                alert('エラー: ' + error.message);
            } finally {
                loadingEl.style.display = 'none';
            }
        }

        function processAndRender(marine, weather) {
            const times = marine.hourly.time;
            const waveHeights = marine.hourly.wave_height;
            const waveDirections = marine.hourly.wave_direction;
            const seaLevels = marine.hourly.sea_level_height_msl;
            const windSpeeds = weather.hourly.wind_speed_10m.map(v => v !== null ? (v / 3.6).toFixed(1) : null);
            const windDirections = weather.hourly.wind_direction_10m;

            const labels = times.map(t => {
                const d = new Date(t);
                const month = d.getMonth() + 1;
                const date = d.getDate();
                const hours = d.getHours();
                return hours === 0 ? `${month}/${date}` : `${hours}`;
            });

            const now = new Date();
            let currentIndex = 0;
            let minDiff = Infinity;
            times.forEach((t, i) => {
                const diff = Math.abs(new Date(t) - now);
                if (diff < minDiff) {
                    minDiff = diff;
                    currentIndex = i;
                }
            });

            const curWave = waveHeights[currentIndex] !== null ? waveHeights[currentIndex].toFixed(2) : '--';
            const curTide = seaLevels[currentIndex] !== null ? seaLevels[currentIndex].toFixed(2) : '--';
            const curWindSpeed = windSpeeds[currentIndex] !== null ? windSpeeds[currentIndex] : '--';
            const curWindDirDeg = windDirections[currentIndex];
            const windType = getWindType(curWindDirDeg);

            const todayWaveHeights = waveHeights.slice(0, 24).filter(v => v !== null);
            const maxWaveVal = todayWaveHeights.length > 0 ? Math.max(...todayWaveHeights).toFixed(2) : '--';

            let tideNotice = '高度 ' + curTide + 'm';
            if (currentIndex + 1 < seaLevels.length) {
                const isRising = seaLevels[currentIndex + 1] > seaLevels[currentIndex];
                tideNotice = isRising ? '上げ潮傾向' : '下げ潮傾向';
            }

            document.getElementById('currentWave').textContent = curWave + 'm';
            document.getElementById('maxWave').textContent = '本日最大 ' + maxWaveVal + 'm';
            document.getElementById('currentTide').textContent = curTide + 'm';
            document.getElementById('tideForecast').textContent = tideNotice;
            document.getElementById('currentWind').textContent = curWindSpeed + 'm/s';
            
            const badgeEl = document.getElementById('windTypeBadge');
            badgeEl.textContent = windType.text;
            badgeEl.className = 'wind-badge ' + windType.class;

            renderChart(labels, times, waveHeights, seaLevels, currentIndex);
            renderTimeline(waveDirections, windSpeeds, windDirections);
        }

        function renderChart(labels, rawTimes, waveData, tideData, currentIndex) {
            const ctx = document.getElementById('marineChart').getContext('2d');
            if (myChart) myChart.destroy();

            const maxWaveVal = Math.max(...waveData.filter(v => v !== null), 0);
            const targetMax = maxWaveVal > 2.0 ? Math.ceil(maxWaveVal * 1.1 * 10) / 10 : 2.0;

            const tickFontColors = rawTimes.map(t => (new Date(t).getHours() % 3 === 0) ? '#f8fafc' : '#64748b');
            const tickFontWeights = rawTimes.map(t => (new Date(t).getHours() % 3 === 0) ? 'bold' : 'normal');
            const tickFontSizes = rawTimes.map(t => {
                const h = new Date(t).getHours();
                return (h === 0 || h % 3 === 0) ? 11 : 9;
            });

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '波高 (m)',
                            data: waveData,
                            backgroundColor: 'rgba(56, 189, 248, 0.65)',
                            borderColor: '#38bdf8',
                            borderWidth: 1,
                            yAxisID: 'yWave',
                            order: 2
                        },
                        {
                            label: '潮位 (m)',
                            data: tideData,
                            type: 'line',
                            borderColor: '#fb923c',
                            borderWidth: 2.5,
                            tension: 0.4,
                            pointRadius: 0,
                            yAxisID: 'yTide',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { display: false },
                        currentTimeLineIndex: currentIndex
                    },
                    scales: {
                        x: {
                            ticks: { 
                                autoSkip: false,
                                maxRotation: 0, 
                                font: function(context) {
                                    return {
                                        size: tickFontSizes[context.index] || 10,
                                        weight: tickFontWeights[context.index] || 'normal'
                                    };
                                },
                                color: function(context) {
                                    return tickFontColors[context.index] || '#94a3b8';
                                }
                            },
                            grid: { color: 'rgba(51, 65, 85, 0.3)' }
                        },
                        yWave: {
                            type: 'linear',
                            position: 'left',
                            display: false,
                            beginAtZero: true,
                            max: targetMax
                        },
                        yTide: {
                            type: 'linear',
                            position: 'right',
                            title: { display: true, text: '潮位(m)', color: '#fb923c' },
                            ticks: { color: '#fb923c' },
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        function renderTimeline(waveDirs, windSpeeds, windDirs) {
            const container = document.getElementById('timelineData');
            container.innerHTML = '';

            waveDirs.forEach((waveDeg, i) => {
                const waveInfo = getDirectionInfo(waveDeg);
                const windSpeed = windSpeeds[i];
                const windInfo = getDirectionInfo(windDirs[i]);

                const col = document.createElement('div');
                col.className = 'timeline-col';
                col.innerHTML = `
                    <div class="wave-dir-arrow">${waveInfo.arrow}</div>
                    <div class="wind-val">${windSpeed !== null ? windSpeed : '--'}</div>
                    <div class="wind-arrow">${windInfo.arrow}</div>
                `;
                container.appendChild(col);
            });
        }

        window.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
