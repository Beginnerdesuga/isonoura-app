<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯の浦 波・潮・風・天気モニター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --accent-weather: #facc15;
            --border-color: #334155;
            --sticky-width: 42px; /* 固定目盛列の幅 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; color: var(--text-secondary); }
        .location-note { font-size: 0.65rem; color: #64748b; margin-top: 2px; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .metric-label { font-size: 0.65rem; color: var(--text-secondary); }
        .metric-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
        .metric-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 1px; }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }
        .metric-value.weather { color: var(--accent-weather); }

        .wind-badge {
            display: inline-block;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            margin-top: 2px;
            font-weight: 600;
        }
        .badge-offshore { background-color: #166534; color: #4ade80; }
        .badge-onshore { background-color: #991b1b; color: #fca5a5; }
        .badge-cross { background-color: #854d0e; color: #fef08a; }

        .scroll-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .selected-time-display {
            color: #f8fafc;
            font-weight: bold;
            background: #334155;
            padding: 1px 6px;
            border-radius: 4px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .chart-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .chart-container-inner {
            position: relative;
            height: 280px;
        }

        .timeline-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 4px;
        }

        .timeline-table td {
            padding: 4px 0;
            color: var(--text-secondary);
        }

        .wind-arrow {
            display: inline-block;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .weather-icon-cell {
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>磯の浦 波・潮・風・天気モニター</h1>
        <div class="subtitle">和歌山県 和歌山市 磯の浦海岸</div>
        <div class="location-note">※風向き判定：オフショア(北〜北東) / オンショア(南〜南西)</div>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">波高 / 周期</div>
            <div class="metric-value wave" id="current-wave">0.8m</div>
            <div class="metric-sub" id="current-period">6.2秒</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">潮位 (和歌山)</div>
            <div class="metric-value tide" id="current-tide">142cm</div>
            <div class="metric-sub" id="current-tide-state">中潮 (上げ潮)</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">風向・風速</div>
            <div class="metric-value wind" id="current-wind">北北東 2.5m</div>
            <div id="current-wind-badge-container">
                <span class="wind-badge badge-offshore" id="current-wind-badge">オフショア</span>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-label">天気・気温</div>
            <div class="metric-value weather" id="current-weather">☀️ 晴れ</div>
            <div class="metric-sub" id="current-temp">24℃</div>
        </div>
    </div>

    <div class="scroll-hint">
        <span>タップして選択: <span class="selected-time-display" id="selected-time">12:00</span></span>
        <span>← 左右にスクロール →</span>
    </div>

    <div class="chart-card">
        <div class="chart-scroll-wrapper" id="scroll-wrapper">
            <div class="chart-container-inner" id="chart-inner">
                <canvas id="comboChart"></canvas>
            </div>
            <table class="timeline-table" id="timeline-table">
                <tr id="row-weather"></tr>
                <tr id="row-temp"></tr>
                <tr id="row-wind-dir"></tr>
                <tr id="row-wind-speed"></tr>
            </table>
        </div>
    </div>

    <script>
        // 天気コードに応じたアイコン・ラベルのマップ
        const weatherMap = {
            'sunny': { icon: '☀️', label: '晴れ' },
            'cloudy': { icon: '☁️', label: '曇り' },
            'rainy': { icon: '☔', label: '雨' },
            'partly_cloudy': { icon: '⛅', label: '晴れ/曇り' }
        };

        // サンプルデータ（天気・気温を追加）
        const hourlyData = [
            { time: '03:00', wave: 0.6, period: 5.5, tide: 80, windSpeed: 3.1, windDirStr: '北北東', windDeg: 22.5, type: 'offshore', weather: 'sunny', temp: 19 },
            { time: '06:00', wave: 0.7, period: 5.8, tide: 120, windSpeed: 2.8, windDirStr: '北', windDeg: 0, type: 'offshore', weather: 'sunny', temp: 21 },
            { time: '09:00', wave: 0.8, period: 6.0, tide: 165, windSpeed: 2.2, windDirStr: '北東', windDeg: 45, type: 'offshore', weather: 'partly_cloudy', temp: 23 },
            { time: '12:00', wave: 0.8, period: 6.2, tide: 142, windSpeed: 2.5, windDirStr: '北北東', windDeg: 22.5, type: 'offshore', weather: 'sunny', temp: 25 },
            { time: '15:00', wave: 0.9, period: 6.5, tide: 95, windSpeed: 4.1, windDirStr: '南西', windDeg: 225, type: 'onshore', weather: 'cloudy', temp: 24 },
            { time: '18:00', wave: 0.7, period: 5.9, tide: 110, windSpeed: 3.5, windDirStr: '西', windDeg: 270, type: 'cross', weather: 'rainy', temp: 22 },
            { time: '21:00', wave: 0.5, period: 5.2, tide: 135, windSpeed: 2.0, windDirStr: '西北西', windDeg: 292.5, type: 'offshore', weather: 'cloudy', temp: 20 }
        ];

        // 各要素の取得
        const currentWaveEl = document.getElementById('current-wave');
        const currentPeriodEl = document.getElementById('current-period');
        const currentTideEl = document.getElementById('current-tide');
        const currentWindEl = document.getElementById('current-wind');
        const currentWindBadgeEl = document.getElementById('current-wind-badge');
        const currentWeatherEl = document.getElementById('current-weather');
        const currentTempEl = document.getElementById('current-temp');
        const selectedTimeEl = document.getElementById('selected-time');

        // タイムラインテーブルの構築
        const rowWeather = document.getElementById('row-weather');
        const rowTemp = document.getElementById('row-temp');
        const rowWindDir = document.getElementById('row-wind-dir');
        const rowWindSpeed = document.getElementById('row-wind-speed');

        hourlyData.forEach(d => {
            const wInfo = weatherMap[d.weather] || { icon: '❓', label: '-' };

            // 天気アイコン
            const tdWeather = document.createElement('td');
            tdWeather.className = 'weather-icon-cell';
            tdWeather.innerHTML = wInfo.icon;
            tdWeather.title = wInfo.label;
            rowWeather.appendChild(tdWeather);

            // 気温
            const tdTemp = document.createElement('td');
            tdTemp.innerText = `${d.temp}℃`;
            rowTemp.appendChild(tdTemp);

            // 風向矢印
            const tdDir = document.createElement('td');
            tdDir.innerHTML = `<span class="wind-arrow" style="transform: rotate(${d.windDeg}deg); display:inline-block;">↓</span>`;
            rowWindDir.appendChild(tdDir);

            // 風速
            const tdSpeed = document.createElement('td');
            tdSpeed.innerText = `${d.windSpeed}m`;
            rowWindSpeed.appendChild(tdSpeed);
        });

        // 選択されたカードの情報を更新する関数
        function updateMetrics(index) {
            const data = hourlyData[index];
            const wInfo = weatherMap[data.weather] || { icon: '❓', label: '-' };

            selectedTimeEl.innerText = data.time;
            currentWaveEl.innerText = `${data.wave}m`;
            currentPeriodEl.innerText = `${data.period}秒`;
            currentTideEl.innerText = `${data.tide}cm`;
            currentWindEl.innerText = `${data.windDirStr} ${data.windSpeed}m`;
            currentWeatherEl.innerText = `${wInfo.icon} ${wInfo.label}`;
            currentTempEl.innerText = `${data.temp}℃`;

            // バッジの更新
            if (data.type === 'offshore') {
                currentWindBadgeEl.className = 'wind-badge badge-offshore';
                currentWindBadgeEl.innerText = 'オフショア';
            } else if (data.type === 'onshore') {
                currentWindBadgeEl.className = 'wind-badge badge-onshore';
                currentWindBadgeEl.innerText = 'オンショア';
            } else {
                currentWindBadgeEl.className = 'wind-badge badge-cross';
                currentWindBadgeEl.innerText = 'サイド/クロス';
            }
        }

        // Chart.js の初期化
        const ctx = document.getElementById('comboChart').getContext('2d');
        const labels = hourlyData.map(d => d.time);
        const waveData = hourlyData.map(d => d.wave);
        const tideData = hourlyData.map(d => d.tide);

        const chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: '波高 (m)',
                        data: waveData,
                        backgroundColor: 'rgba(56, 189, 248, 0.6)',
                        borderColor: '#38bdf8',
                        borderWidth: 1,
                        yAxisID: 'yWave',
                        order: 2
                    },
                    {
                        label: '潮位 (cm)',
                        data: tideData,
                        type: 'line',
                        borderColor: '#fb923c',
                        backgroundColor: 'rgba(251, 146, 60, 0.1)',
                        fill: true,
                        tension: 0.4,
                        yAxisID: 'yTide',
                        order: 1
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                onClick: (e, elements) => {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        updateMetrics(index);
                    }
                },
                scales: {
                    x: {
                        grid: { color: '#334155' },
                        ticks: { color: '#94a3b8' }
                    },
                    yWave: {
                        type: 'linear',
                        position: 'left',
                        title: { display: true, text: '波高 (m)', color: '#38bdf8' },
                        grid: { color: '#334155' },
                        ticks: { color: '#38bdf8' },
                        min: 0,
                        max: 2.0
                    },
                    yTide: {
                        type: 'linear',
                        position: 'right',
                        title: { display: true, text: '潮位 (cm)', color: '#fb923c' },
                        grid: { drawOnChartArea: false },
                        ticks: { color: '#fb923c' },
                        min: 0,
                        max: 200
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#f8fafc' }
                    }
                }
            }
        });

        // 初期表示の設定 (例: 12:00のインデックス3を選択)
        updateMetrics(3);
    </script>
</body>
</html>
