<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯ノ浦 波・潮・風モニター</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.2rem; font-weight: 700; }
        .subtitle { font-size: 0.7rem; color: var(--text-secondary); }
        .location-note { font-size: 0.65rem; color: #64748b; margin-top: 2px; }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
        }

        .metric-label { font-size: 0.65rem; color: var(--text-secondary); }
        .metric-value { font-size: 1.05rem; font-weight: 700; margin-top: 2px; }
        .metric-sub { font-size: 0.65rem; color: var(--text-secondary); margin-top: 1px; }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }

        .wind-badge {
            display: inline-block;
            font-size: 0.6rem;
            padding: 1px 5px;
            border-radius: 4px;
            margin-top: 2px;
            font-weight: 600;
        }
        .badge-offshore { background-color: #166534; color: #4ade80; }
        .badge-onshore { background-color: #991b1b; color: #fca5a5; }
        .badge-cross { background-color: #854d0e; color: #fef08a; }

        .scroll-hint {
            font-size: 0.7rem;
            color: var(--text-secondary);
            text-align: right;
            margin-bottom: 4px;
        }

        /* 外部コンテナ */
        .chart-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        .chart-scroll-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            padding: 10px 0;
        }

        .chart-inner {
            width: 2600px;
            position: relative;
        }

        /* 左側完全固定列 */
        .sticky-left-column {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 54px;
            background-color: var(--card-bg);
            z-index: 10;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            pointer-events: none;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .sticky-label-wave {
            height: 275px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: bold;
            color: var(--accent-wave);
            border-bottom: 1px dashed var(--border-color);
        }

        .sticky-timeline-labels {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 4px 0;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
        }

        .sticky-timeline-labels .label-wave-dir { color: var(--accent-wave); }
        .sticky-timeline-labels .label-wind-val { color: var(--accent-wind); }

        .canvas-container {
            height: 300px;
            position: relative;
            padding-left: 54px; /* 固定列の幅ぶん右へずらす */
        }

        /* タイムライン領域（波向・風速・風向） */
        .timeline-wrapper {
            display: flex;
            border-top: 1px dashed var(--border-color);
            margin-top: 6px;
            padding-top: 6px;
            padding-left: 54px; /* 固定列の幅ぶん右へずらす */
        }

        .timeline-data {
            display: flex;
            flex-grow: 1;
            padding-right: 40px;
        }

        .timeline-col {
            flex: 1;
            text-align: center;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }

        .wave-dir-arrow {
            font-size: 0.8rem;
            color: var(--accent-wave);
            font-weight: bold;
            height: 20px;
            line-height: 20px;
        }

        .wind-val {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-wind);
            height: 20px;
            line-height: 20px;
        }

        .wind-arrow {
            font-size: 0.85rem;
            color: var(--text-primary);
            height: 20px;
            line-height: 20px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .btn-refresh {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .last-update { font-size: 0.75rem; color: var(--text-secondary); }

        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            z-index: 20;
        }
    </style>
</head>

        <h1>🌊 磯ノ浦コンディション</h1>
        <p class="subtitle">Open-Meteo API リアルタイム連携</p>
        <p class="location-note">※ 観測地点: 北緯34.25, 東経135.08（磯ノ浦沖約1km）</p>
    </header>

            <div class="metric-sub" id="maxWave">本日最大 --</div>
        </div>
