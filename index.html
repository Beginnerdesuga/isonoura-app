<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>磯の浦 波・潮・風・天気モニター</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="磯の浦">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --text-secondary: #94a3b8;
            --accent-wave: #38bdf8;
            --accent-tide: #fb923c;
            --accent-wind: #4ade80;
            --accent-weather: #facc15;
            --border-color: #334155;
            --axis-width: 42px;
            --chart-h: clamp(200px, calc(100vh - 474px), 360px);
        }
        @supports (height: 100svh) {
            :root { --chart-h: clamp(200px, calc(100svh - 474px), 360px); }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Segoe UI", Roboto, Arial, sans-serif;
        }

        body {
            background: linear-gradient(180deg, #0a1b33, #12365c);
            color: #f8fafc;
            padding: 12px 12px 92px; /* 下の92pxは、浮いているタブバーに隠れないための余白 */
            max-width: 600px;
            min-height: 100vh;
            margin: 0 auto;
        }

        /* ===== ヘッダー ===== */
        header {
            text-align: left;
            padding: 0 2px;
            margin-bottom: 8px;
        }
        h1 { font-size: 1.15rem; font-weight: 700; letter-spacing: .04em; }

        /* ===== 上段カード ===== */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }

        .metric-card {
            background: rgba(255, 255, 255, .07);
            border-radius: 18px;
            padding: 9px 2px;
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .metric-label {
            height: 16px;
            line-height: 16px;
            font-size: .68rem;
            color: #9fb4cc;
        }

        .metric-value {
            height: 24px;
            line-height: 24px;
            font-size: 15px;
            font-weight: 500;
            margin-top: 2px;
        }
        .metric-value.wave { color: var(--accent-wave); }
        .metric-value.tide { color: var(--accent-tide); }
        .metric-value.wind { color: var(--accent-wind); }
        .metric-value.weather {
            height: 26px;
            line-height: 26px;
            font-size: 1.3rem;
            margin-top: 0;
            color: var(--accent-weather);
        }

        .metric-sub {
            height: 20px;
            line-height: 20px;
            font-size: 12px;
            font-weight: 400;
            color: #e2e8f0;
            letter-spacing: -0.5px;
            white-space: nowrap;
        }
        #seaTempText {
            height: 24px;
            line-height: 24px;
            font-size: 15px;
            font-weight: 500;
            margin-top: 2px;
            color: var(--accent-wave);
        }

        .compass-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 26px;
        }
        .compass-svg { width: 28px; height: 28px; }

        .moon-icon {
            height: 26px;
            line-height: 26px;
            font-size: 1.05rem;
        }

        .wind-badge {
            display: inline-block;
            align-self: center;
            max-width: 100%;
            height: 20px;
            line-height: 20px;
            padding: 0 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 400;
            white-space: nowrap;
            transform-origin: center;
        }
        .badge-offshore { background: rgba(74, 222, 128, .2); color: #86efac; }
        .badge-cross { background: rgba(250, 204, 21, .2); color: #fde68a; }
        .badge-onshore { background: rgba(251, 113, 133, .22); color: #fda4af; }

        /* ===== グラフ ===== */
        .chart-card {
            background: #15304f;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            padding: 10px 0 6px 0;
        }

        .cat-mascot {
            position: absolute;
            top: 42px;
            right: 8px;
            z-index: 15;
            width: 64px;
            height: 64px;
            background: url('images/cats-surf.png') 0 0 / 384px auto no-repeat; /* 横長の画像を縮めて、左端の1コマを表示 */
            image-rendering: pixelated;
            pointer-events: none;
            animation: float 2.5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .chart-legend-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px 8px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
            margin-bottom: 6px;
        }

        .legend-item {
            font-size: 0.7rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .legend-color-box {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
        .legend-wave { color: var(--accent-wave); }
        .legend-wave .legend-color-box { background-color: var(--accent-wave); }
        .legend-tide { color: var(--accent-tide); }
        .legend-tide .legend-color-box { background-color: var(--accent-tide); }

        .chart-scroll-wrapper {
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .chart-inner {
            width: 6000px;
            position: relative;
        }
        .canvas-container {
            height: var(--chart-h);
            position: relative;
        }
        .main-chart-container {
            margin-left: var(--axis-width);
            height: var(--chart-h);
            position: relative;
        }

        /* 左に固定する軸 */
        .sticky-axis-container {
            position: sticky;
            left: 0;
            top: 0;
            width: var(--axis-width);
            height: 100%;
            z-index: 10;
            background-color: #15304f;
            border-right: 1px solid rgba(51, 65, 85, 0.4);
            float: left;
            display: flex;
            flex-direction: column;
        }
        .axis-timeline-labels {
            height: 65px;
            margin-top: 6px;
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            background-color: #15304f;
        }
        .axis-chart-box { height: var(--chart-h); }
        .axis-label-item {
            height: 20px;
            line-height: 20px;
            font-size: 0.65rem;
            font-weight: bold;
            text-align: center;
        }
        .axis-label-item.wave-label { color: var(--accent-wave); }
        .axis-label-item.wind-val-label { color: var(--accent-wind); }
        .axis-label-item.wind-dir-label { color: var(--text-secondary); }

        /* グラフ下の波向・風速・風向 */
        .timeline-wrapper {
            position: relative;
            border-top: 1px dashed var(--border-color);
            margin-top: 6px;
            padding-top: 6px;
            height: 65px;
            margin-left: var(--axis-width);
        }
        .timeline-col {
            position: absolute;
            transform: translateX(-50%);
            text-align: center;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            user-select: none;
        }
        .wave-dir-arrow, .wind-val, .wind-arrow {
            height: 20px;
            line-height: 20px;
        }
        .wave-dir-arrow {
            font-size: 0.8rem;
            color: var(--accent-wave);
            font-weight: bold;
        }
        .wind-val {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-wind);
        }
        .wind-arrow {
            font-size: 0.85rem;
            color: #f8fafc;
        }

        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(21, 48, 79, .95);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 600;
            z-index: 20;
        }

        /* ===== 更新時刻・現在ボタン ===== */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }
        .last-update { font-size: 0.75rem; color: var(--text-secondary); }
        .btn-refresh {
            background: #7dd3fc;
            color: #07304f;
            border: none;
            border-radius: 999px;
            padding: 7px 16px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-refresh:hover { opacity: 0.9; }

        /* ===== コンディション予想と下部の説明 ===== */
        #conditionAdviceCard {
            background: rgba(255, 255, 255, .07);
            border-radius: 18px;
            padding: 10px;
            margin-top: 6px;
            font-size: 0.8rem;
            line-height: 1.4;
        }
        .advice-title {
            font-weight: bold;
            color: var(--accent-wave);
            margin-bottom: 4px;
        }
        #conditionAdviceText { color: #e2e8f0; }

        .page-notes {
            margin-top: 16px;
            padding: 0 4px;
            color: #9fb4cc;
        }
        .subtitle { font-size: 0.7rem; }
        .location-note { font-size: 0.65rem; margin-top: 2px; }

        /* ===== 下のタブバー（3ページ共通） ===== */
        .tabbar {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: calc(14px + env(safe-area-inset-bottom));
            width: calc(100% - 28px);
            max-width: 400px;
            display: flex;
            gap: 4px;
            padding: 5px;
            background: rgba(15, 36, 66, .82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 999px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
            z-index: 100;
        }
        .tabbar a {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #b6c8dc;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", Roboto, Arial, sans-serif;
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .04em;
            padding: 10px 4px;
            border-radius: 999px;
            transition: background .2s, color .2s;
            white-space: nowrap;
        }
        .tabbar a.on { background: #7dd3fc; color: #07304f; font-weight: 700; }
    </style>
</head>
<body>

    <header>
        <h1>🌊 磯の浦コンディション</h1>
    </header>

    <div class="metrics-grid">
        <div class="metric-card">
            <div class="metric-label">波高・波向</div>
            <div class="metric-value wave" id="currentWave">--</div>
            <div class="metric-sub" id="wavePeriodText">周期:--</div>
            <div class="compass-wrap">
                <svg class="compass-svg" viewBox="0 0 30 30">
                    <circle cx="15" cy="15" r="12" fill="none" stroke="#334155" stroke-width="1.5"/>
                    <text x="15" y="5.5" text-anchor="middle" font-size="6" fill="#64748b">沖</text>
                    <g id="waveCompassArrow">
                        <line x1="15" y1="15" x2="15" y2="5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/>
                        <polygon points="15,3 12.7,7.5 17.3,7.5" fill="#38bdf8"/>
                    </g>
                    <circle cx="15" cy="15" r="1.4" fill="#f8fafc"/>
                </svg>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-label" id="tideLabel">潮位</div>
            <div class="metric-value tide" id="currentTide">--</div>
            <div class="metric-sub" id="tideExtreme">満-- 干--</div>
            <div class="moon-icon" id="moonIcon">--</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">風速・風向</div>
            <div class="metric-value wind" id="currentWind">--</div>
            <div id="windTypeBadge" class="wind-badge">--</div>
            <div class="compass-wrap">
                <svg class="compass-svg" viewBox="0 0 30 30">
                    <circle cx="15" cy="15" r="12" fill="none" stroke="#334155" stroke-width="1.5"/>
                    <text x="15" y="5.5" text-anchor="middle" font-size="6" fill="#64748b">沖</text>
                    <g id="windCompassArrow">
                        <line x1="15" y1="15" x2="15" y2="5" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
                        <polygon points="15,3 12.7,7.5 17.3,7.5" fill="#4ade80"/>
                    </g>
                    <circle cx="15" cy="15" r="1.4" fill="#f8fafc"/>
                </svg>
            </div>
        </div>
        <div class="metric-card">
            <div class="metric-label">天気 / 水温</div>
            <div class="metric-sub" id="seaTempText">水温 --℃</div>
            <div class="metric-sub" id="weatherText">--</div>
            <div class="metric-value weather" id="currentWeather">--</div>
        </div>
    </div>

    <div class="chart-card">
        <div id="loading" class="loading-overlay">取得中...</div>
        <div class="cat-mascot"></div>

        <div class="chart-legend-header">
            <div class="legend-item legend-wave">
                <span class="legend-color-box"></span>
                <span>波高 (m)</span>
            </div>
            <div class="legend-item legend-tide">
                <span class="legend-color-box"></span>
                <span id="tideLegendText">潮位 (m)</span>
            </div>
        </div>

        <div class="chart-scroll-wrapper">
            <div class="chart-inner">
                <div class="sticky-axis-container">
                    <div class="axis-chart-box">
                        <canvas id="axisChart"></canvas>
                    </div>
                    <div class="axis-timeline-labels">
                        <div class="axis-label-item wave-label">波向</div>
                        <div class="axis-label-item wind-val-label">風速</div>
                        <div class="axis-label-item wind-dir-label">風向</div>
                    </div>
                </div>
                <div class="canvas-container">
                    <div class="main-chart-container">
                        <canvas id="marineChart"></canvas>
                    </div>
                </div>
                <div class="timeline-wrapper" id="timelineWrapper"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <span class="last-update" id="lastUpdate">更新: --</span>
        <button class="btn-refresh" onclick="resetToNow()">現在</button>
    </div>

    <div id="conditionAdviceCard">
        <div class="advice-title">💡 コンディション予想</div>
        <div id="conditionAdviceText">データ読み込み中...</div>
    </div>

    <div class="page-notes">
        <p class="subtitle">Open-Meteo API リアルタイム連携</p>
        <p class="location-note">※ 観測地点: 北緯34.25, 東経135.08（磯の浦沖約1km）波・風起点：南南西・200°</p>
    </div>

    <script>
        let myChart = null;
        let axisChart = null;
        let globalData = null;
        let selectedIndex = 0;
        let nowIndex = 0;

        const SHORE_NORMAL_DEG = 200;

        function toShoreRelativeAngle(absoluteDeg) {
            if (absoluteDeg == null) return 0;
            let relative = absoluteDeg - SHORE_NORMAL_DEG;
            relative = ((relative % 360) + 360) % 360;
            return relative;
        }

        const DAY_START_HOUR = 5;
        const DAY_END_HOUR = 18;

        function isDaytime(hour) {
            return hour >= DAY_START_HOUR && hour <= DAY_END_HOUR;
        }

        const dayNightBgPlugin = {
            id: 'dayNightBg',
            beforeDatasetsDraw: (chart) => {
                if (chart.canvas.id !== 'marineChart' || !globalData || !globalData.times.length) return;

                const { ctx, chartArea: { top, bottom }, scales: { x } } = chart;
                const times = globalData.times;
                ctx.save();

                for (let i = 0; i < times.length; i++) {
                    const hour = new Date(times[i]).getHours();
                    const day = isDaytime(hour);

                    const xCenter = x.getPixelForValue(i);
                    const half = (x.getPixelForValue(1) - x.getPixelForValue(0)) / 2 || 8;
                    const xStart = xCenter - half;
                    const xEnd = xCenter + half;

                    ctx.fillStyle = day ? 'rgba(250, 204, 21, 0.05)' : 'rgba(15, 23, 42, 0.45)';
                    ctx.fillRect(xStart, top, xEnd - xStart, bottom - top);
                }

                ctx.restore();
            }
        };

        Chart.register(dayNightBgPlugin);

        // 波高の棒にやわらかい水色の光を付ける
        const barGlowPlugin = {
            id: 'barGlow',
            beforeDatasetDraw: (chart, args) => {
                if (chart.canvas.id !== 'marineChart' || args.index !== 0) return;
                chart.ctx.save();
                chart.ctx.shadowColor = 'rgba(56, 189, 248, 0.45)';
                chart.ctx.shadowBlur = 8;
            },
            afterDatasetDraw: (chart, args) => {
                if (chart.canvas.id !== 'marineChart' || args.index !== 0) return;
                chart.ctx.restore();
            }
        };
        Chart.register(barGlowPlugin);


        const timeLineLinesPlugin = {
            id: 'timeLineLines',
            afterDraw: (chart) => {
                const meta = chart.getDatasetMeta(0);
                if (!meta || !meta.data || meta.data.length === 0) return;

                const topY = chart.scales.yWave.top;
                const bottomY = chart.scales.yWave.bottom;
                const ctx = chart.ctx;

                const drawLine = (idx, color) => {
                    if (idx >= 0 && meta.data[idx]) {
                        const x = meta.data[idx].x;
                        ctx.save();
                        ctx.beginPath();
                        ctx.moveTo(x, topY);
                        ctx.lineTo(x, bottomY);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = color;
                        ctx.setLineDash([4, 4]);
                        ctx.stroke();
                        ctx.restore();
                    }
                };

                drawLine(nowIndex, '#ef4444');

                const targetIndex = chart.config.options.plugins.targetIndex;
                if (targetIndex !== undefined && targetIndex !== nowIndex) {
                    drawLine(targetIndex, '#38bdf8');
                }

                syncTimelinePositions(chart);
            }
        };

        Chart.register(timeLineLinesPlugin);

        function getWeatherInfo(code) {
            if (code == null) return { icon: '--', text: '--' };
            if (code === 0) return { icon: '☀️', text: '快晴' };
            if (code === 1 || code === 2) return { icon: '🌤️', text: '晴れ' };
            if (code === 3) return { icon: '☁️', text: 'くもり' };
            if (code >= 45 && code <= 48) return { icon: '🌫️', text: '霧' };
            if (code >= 51 && code <= 55) return { icon: '🌧️', text: '霧雨' };
            if (code >= 61 && code <= 65) return { icon: '☔', text: '雨' };
            if (code >= 80 && code <= 82) return { icon: '🌧️', text: 'にわか雨' };
            if (code >= 95) return { icon: '⚡', text: '雷雨' };
            return { icon: '☁️', text: '不明' };
        }

        function getDirectionInfo(deg) {
            if (deg == null) return { text: '--', arrow: '' };
            const directions = ['北', '北北東', '北東', '東北東', '東', '東南東', '南東', '南南東', '南', '南南西', '南西', '西南西', '西', '西北西', '北西', '北北西'];
            const arrows = ['↓', '↙', '↙', '↙', '←', '↖', '↖', '↖', '↑', '↗', '↗', '↗', '→', '↘', '↘', '↘'];
            const idx = Math.round(deg / 22.5) % 16;
            return { text: directions[idx], arrow: arrows[idx] };
        }

        function getWindType(deg, speed) {
            if (deg == null || speed == null) return { text: '--', class: '' };

            const s = Number(speed);

            if (s < 2.5) {
                return { text: '無風クリーン', class: 'badge-offshore' };
            }

            const isOffshore = (deg >= 337.5 || deg <= 67.5);
            const isOnshore = (deg >= 157.5 && deg <= 247.5);

            if (isOffshore) {
                if (s <= 5.5) {
                    return { text: 'オフショア 面良し', class: 'badge-offshore' };
                } else if (s <= 8.5) {
                    return { text: '強オフ 面煽られ', class: 'badge-cross' };
                } else {
                    return { text: '抑圧強オフ 難あり', class: 'badge-onshore' };
                }
            }

            if (isOnshore) {
                if (s <= 4.0) {
                    return { text: '弱オン ざわつき', class: 'badge-cross' };
                } else {
                    return { text: 'オンショア 面荒れ', class: 'badge-onshore' };
                }
            }

            if (s <= 5.0) {
                return { text: 'クロス風 影響小', class: 'badge-cross' };
            } else {
                return { text: 'クロス風 影響大', class: 'badge-onshore' };
            }
        }

        function getConditionAdvice(waveHeight, windSpeed, windDeg, period) {
            if (waveHeight == null || windSpeed == null || period == null) {
                return "データが不足しているため判定できません。";
            }

            const speed = Number(windSpeed);
            const height = Number(waveHeight);
            const p = Number(period);

            const isOffshore = (windDeg >= 337.5 || windDeg <= 67.5);
            const isOnshore = (windDeg >= 157.5 && windDeg <= 247.5);

            if (height < 0.4) {
                return `波高は${height.toFixed(2)}mとサイズ不足です。面がクリーンであってもうねりのパワーが足りず、サーフボードでのテイクオフや滑走は非常に困難なコンディションです。`;
            }

            if (height >= 0.4 && height < 0.6) {
                if (isOffshore && speed < 8.5) {
                    return `波高${height.toFixed(2)}mの小波コンディションです。面は整っていますがサイズが控えめなため、ロングボードや高浮力ソフトボードでの練習向きです。`;
                } else if (isOnshore) {
                    return `波高${height.toFixed(2)}mとサイズが小さいうえにオンショアの影響で割れづらく、サーフィンには物足りない状態です。`;
                } else {
                    return `波高${height.toFixed(2)}mの物足りないサイズ感です。小波用ボードや浮力のある板での使用をおすすめします。`;
                }
            }

            if (isOffshore && speed >= 8.5 && p <= 6) {
                return `沖合の波高は${height.toFixed(2)}mありますが、10m/s前後の強力なオフショアと短周期(${p}秒)の影響で波頭が抑え込まれます。岸際では波が潰されて割りづらく、表示数値より実効サイズは大幅にダウンする傾向です。`;
            }

            if (isOffshore && speed >= 8.5 && p > 6) {
                return `風が強く波頭が煽られますが、うねりのパワー(${p}秒)があるためインサイド寄りやブレイク位置を選べば遊べる可能性があります。`;
            }

            if (isOffshore && speed >= 2.5 && speed < 8.5) {
                if (p >= 8) {
                    return `適度なオフショアで面が整い、グランドスウェル(${p}秒)のパワーもしっかり届く好コンディションが期待できます。`;
                } else {
                    return `面は綺麗に保たれますが、周期がやや短いため(${p}秒)岸寄りの浅瀬で一気に崩れる波になりやすいです。`;
                }
            }

            if (speed < 2.5) {
                return `風の影響がほとんどなくクリーンな面状態です。うねりの高さ(${height.toFixed(2)}m)通りの素直なブレイクになりやすいです。`;
            }

            if (isOnshore) {
                if (speed >= 5.0) {
                    return `オンショアの風により面が乱れ、ジャンク気味でまとまりのない波になりやすいコンディションです。`;
                } else {
                    return `弱いオンショアにより表面に少しザワつきが出ますが、展開次第で遊べる状態です。`;
                }
            }

            return `横風の影響を受けるコンディションです。風による面の乱れや流れに注意してください。`;
        }

        const SYNODIC_MONTH = 29.53058867;

        function getMoonAge(date) {
            const knownNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0);
            const diffDays = (date.getTime() - knownNewMoon) / 86400000;
            let age = diffDays % SYNODIC_MONTH;
            if (age < 0) age += SYNODIC_MONTH;
            return age;
        }

        function getTidePhaseInfo(date) {
            const age = getMoonAge(date);

            const halfCycle = SYNODIC_MONTH / 2;
            const pos = age % halfCycle;

            if (pos <= 1.5 || pos >= halfCycle - 1.5) return '大潮';
            if (pos <= 3.5 || pos >= halfCycle - 3.5) return '中潮';
            if (pos <= 5.5 || pos >= halfCycle - 5.5) return '小潮';
            if (pos <= 6.5 || pos >= halfCycle - 6.5) return '長潮';
            return '若潮';
        }

        function getMoonPhaseEmoji(date) {
            const age = getMoonAge(date);
            const phases = ['🌑', '🌒', '🌓', '🌔', '🌕', '🌖', '🌗', '🌘'];
            const idx = Math.round((age / SYNODIC_MONTH) * 8) % 8;
            return phases[idx];
        }

        function getTideExtremes(index) {
            if (!globalData || !globalData.seaLevels || globalData.seaLevels.length === 0) {
                return '満-- 干--';
            }

            // 気象庁データがある場合：選択時刻に最も近い満潮・干潮を表示
            if (globalData.tideEvents && globalData.tideEvents.length) {
                const base = new Date(globalData.times[index]).getTime();
                const pick = (type) => {
                    let best = null, bd = Infinity;
                    globalData.tideEvents.forEach(ev => {
                        if (ev.type !== type) return;
                        const d = Math.abs(ev.ts - base);
                        if (d < bd) { bd = d; best = ev; }
                    });
                    if (!best) return '--';
                    const t = new Date(best.ts);
                    return `${t.getHours()}:${t.getMinutes().toString().padStart(2, '0')}`;
                };
                return `満${pick('hi')} 干${pick('lo')}`;
            }

            const start = Math.max(0, index - 12);
            const end = Math.min(globalData.seaLevels.length - 1, index + 12);

            let highTime = '--';
            let lowTime = '--';
            let maxVal = -Infinity;
            let minVal = Infinity;

            for (let i = start; i <= end; i++) {
                const val = globalData.seaLevels[i];
                if (val != null) {
                    if (val > maxVal) {
                        maxVal = val;
                        const d = new Date(globalData.times[i]);
                        highTime = `${d.getHours()}:${d.getMinutes().toString().padStart(2, '0')}`;
                    }
                    if (val < minVal) {
                        minVal = val;
                        const d = new Date(globalData.times[i]);
                        lowTime = `${d.getHours()}:${d.getMinutes().toString().padStart(2, '0')}`;
                    }
                }
            }

            return `満${highTime} 干${lowTime}`;
        }

        // 気象庁（和歌山）の潮位表で、潮位と満潮・干潮を置き換える
        async function applyJmaTide() {
            try {
                const r = await fetch('data/tide.json?' + Date.now());
                if (!r.ok) return;
                const tj = await r.json();
                const days = tj.days || {};
                const pad = (n) => String(n).padStart(2, '0');
                let ok = false;
                const levels = globalData.times.map(t => {
                    const d = new Date(t);
                    const rec = days[`${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`];
                    const v = rec && rec.h ? rec.h[d.getHours()] : null;
                    if (v != null) ok = true;
                    return v == null ? null : v;
                });
                if (!ok) return;
                const events = [];
                Object.keys(days).forEach(key => {
                    (days[key].hi || []).forEach(([tm, cm]) => events.push({ ts: new Date(`${key}T${tm}:00`).getTime(), type: 'hi', cm }));
                    (days[key].lo || []).forEach(([tm, cm]) => events.push({ ts: new Date(`${key}T${tm}:00`).getTime(), type: 'lo', cm }));
                });
                globalData.seaLevels = levels;
                globalData.tideEvents = events;
                globalData.tideUnit = 'cm';
                const lg = document.getElementById('tideLegendText');
                if (lg) lg.textContent = '潮位 (cm)';
            } catch (e) { /* 取得できなければモデル値のまま */ }
        }

        // 通信が止まったら打ち切って、待ち時間を延ばしながらやり直す（3秒→5秒→8秒）
        async function fetchRetry(url){
          const waits=[3000,5000,8000];
          let lastErr;
          for(let i=0;i<waits.length;i++){
            const ctl=new AbortController();
            const timer=setTimeout(()=>ctl.abort(),waits[i]);
            try{
              const res=await fetch(url,{signal:ctl.signal});
              const body=await res.arrayBuffer();
              clearTimeout(timer);
              if(res.status>=500||res.status===429){
                lastErr=new Error('HTTP '+res.status);
                await new Promise(r=>setTimeout(r,1000));
                continue;
              }
              return new Response(body,{status:res.status,statusText:res.statusText,headers:res.headers});
            }catch(e){
              clearTimeout(timer);
              lastErr=(e&&e.name==='AbortError')?new Error('通信がタイムアウトしました'):e;
            }
          }
          throw lastErr||new Error('取得に失敗しました');
        }

        async function fetchData() {
            const loadingEl = document.getElementById('loading');
            if (loadingEl) loadingEl.style.display = 'flex';

            const urlMarine = 'https://marine-api.open-meteo.com/v1/marine?latitude=34.25&longitude=135.08&hourly=wave_height,wave_direction,wave_period,sea_level_height_msl,sea_surface_temperature&timezone=Asia%2FTokyo&forecast_days=7';
            const urlWeather = 'https://api.open-meteo.com/v1/forecast?latitude=34.25&longitude=135.08&hourly=wind_speed_10m,wind_direction_10m,weather_code&timezone=Asia%2FTokyo&forecast_days=7';

            try {
                const [resMarine, resWeather] = await Promise.all([fetchRetry(urlMarine), fetchRetry(urlWeather)]);
                if (!resMarine.ok || !resWeather.ok) throw new Error('API通信に失敗しました。');

                const dataMarine = await resMarine.json();
                const dataWeather = await resWeather.json();

                globalData = {
                    times: dataMarine.hourly.time || [],
                    waveHeights: dataMarine.hourly.wave_height || [],
                    waveDirections: dataMarine.hourly.wave_direction || [],
                    wavePeriods: dataMarine.hourly.wave_period || [],
                    seaLevels: dataMarine.hourly.sea_level_height_msl || [],
                    seaTemps: dataMarine.hourly.sea_surface_temperature || [],
                    windSpeeds: dataWeather.hourly.wind_speed_10m ? dataWeather.hourly.wind_speed_10m.map(v => v != null ? (v / 3.6).toFixed(1) : null) : [],
                    windDirections: dataWeather.hourly.wind_direction_10m || [],
                    weatherCodes: dataWeather.hourly.weather_code || []
                };

                await applyJmaTide();

                const now = new Date();
                let minDiff = Infinity;
                globalData.times.forEach((t, i) => {
                    const diff = Math.abs(new Date(t) - now);
                    if (diff < minDiff) {
                        minDiff = diff;
                        nowIndex = i;
                    }
                });

                selectedIndex = nowIndex;
                renderAll();
                requestAnimationFrame(() => scrollChartToIndex(nowIndex));

                document.getElementById('lastUpdate').textContent = '更新: ' + now.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
            } catch (error) {
                console.error('通信エラー詳細:', error);
                alert('データ取得エラー: ' + error.message + '\n画面を再読み込みするか時間をお試しください。');
            } finally {
                if (loadingEl) loadingEl.style.display = 'none';
            }
        }

        function updateMetricsCards(index) {
            if (!globalData || !globalData.times || !globalData.times[index]) return;

            const t = new Date(globalData.times[index]);
            const curWave = globalData.waveHeights[index] != null ? Number(globalData.waveHeights[index]).toFixed(2) : '--';
            const tideIsCm = globalData.tideUnit === 'cm';
            const curTide = globalData.seaLevels[index] != null ? Number(globalData.seaLevels[index]).toFixed(tideIsCm ? 0 : 2) : '--';
            const curWindSpeed = globalData.windSpeeds[index] != null ? globalData.windSpeeds[index] : '--';
            const curSeaTemp = globalData.seaTemps && globalData.seaTemps[index] != null ? Number(globalData.seaTemps[index]).toFixed(1) : '--';
            const windType = getWindType(globalData.windDirections[index], curWindSpeed);
            const weatherInfo = getWeatherInfo(globalData.weatherCodes[index]);

            const periodVal = globalData.wavePeriods[index] != null ? Math.round(globalData.wavePeriods[index]) : '--';
            document.getElementById('wavePeriodText').textContent = `周期:${periodVal}秒`;

            document.getElementById('tideExtreme').textContent = getTideExtremes(index);

            document.getElementById('currentWave').textContent = curWave !== '--' ? `${curWave}m` : '--';
            document.getElementById('currentTide').textContent = curTide !== '--' ? `${curTide}${tideIsCm ? 'cm' : 'm'}` : '--';
            document.getElementById('currentWind').textContent = curWindSpeed !== '--' ? `${curWindSpeed}m/s` : '--';

            const tidePhase = getTidePhaseInfo(t);
            document.getElementById('tideLabel').textContent = `潮位/${tidePhase}`;
            document.getElementById('moonIcon').textContent = getMoonPhaseEmoji(t);

            const badgeEl = document.getElementById('windTypeBadge');
            badgeEl.textContent = windType.text;
            badgeEl.className = `wind-badge ${windType.class}`;
            fitTextToWidth(badgeEl);

            document.getElementById('weatherText').textContent = weatherInfo.text;
            document.getElementById('currentWeather').textContent = weatherInfo.icon;
            document.getElementById('seaTempText').textContent = `水温 ${curSeaTemp}℃`;

            const waveArrow = document.getElementById('waveCompassArrow');
            if (waveArrow) {
                const waveAngle = toShoreRelativeAngle(globalData.waveDirections[index]);
                waveArrow.setAttribute('transform', `rotate(${waveAngle} 15 15)`);
            }
            const windArrow = document.getElementById('windCompassArrow');
            if (windArrow) {
                const windAngle = toShoreRelativeAngle(globalData.windDirections[index]);
                windArrow.setAttribute('transform', `rotate(${windAngle} 15 15)`);
            }

            const curWaveVal = globalData.waveHeights[index];
            const curWindSpeedVal = globalData.windSpeeds[index];
            const curWindDegVal = globalData.windDirections[index];
            const curPeriodVal = globalData.wavePeriods[index];

            const adviceText = getConditionAdvice(curWaveVal, curWindSpeedVal, curWindDegVal, curPeriodVal);
            const adviceEl = document.getElementById('conditionAdviceText');
            if (adviceEl) {
                adviceEl.textContent = adviceText;
            }
        }

        function fitTextToWidth(el) {
            el.style.transform = 'scale(1)';
            const parent = el.parentElement;
            if (!parent) return;
            const style = getComputedStyle(parent);
            const paddingX = parseFloat(style.paddingLeft) + parseFloat(style.paddingRight);
            const availableWidth = parent.clientWidth - paddingX;
            const textWidth = el.scrollWidth;
            if (availableWidth > 0 && textWidth > availableWidth) {
                el.style.transform = `scale(${availableWidth / textWidth})`;
            }
        }

        function scrollChartToIndex(index) {
            if (!myChart) return;
            const meta = myChart.getDatasetMeta(0);
            if (!meta || !meta.data || !meta.data[index]) return;

            const wrapper = document.querySelector('.chart-scroll-wrapper');
            if (!wrapper) return;

            const axisWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--axis-width')) || 42;
            const barX = meta.data[index].x;
            const visibleWidth = wrapper.clientWidth - axisWidth;
            let target = barX - visibleWidth / 2;

            const maxScroll = wrapper.scrollWidth - wrapper.clientWidth;
            target = Math.max(0, Math.min(target, maxScroll));

            wrapper.scrollLeft = target;
        }

        function resetToNow() {
            if (!globalData) {
                fetchData();
                return;
            }
            selectedIndex = nowIndex;
            renderAll();
            requestAnimationFrame(() => scrollChartToIndex(nowIndex));
        }

        function selectIndex(index) {
            selectedIndex = index;
            updateMetricsCards(selectedIndex);
            if (myChart) {
                myChart.config.options.plugins.targetIndex = selectedIndex;
                myChart.update();
            }
        }

        function renderAll() {
            if (!globalData || !globalData.times) return;

            const labels = globalData.times.map(t => {
                const d = new Date(t);
                return d.getHours() === 0 ? `${d.getMonth() + 1}/${d.getDate()}` : `${d.getHours()}`;
            });

            updateMetricsCards(selectedIndex);
            renderTimelineData(globalData.waveDirections, globalData.windSpeeds, globalData.windDirections);
            renderChart(labels, globalData.times, globalData.waveHeights, globalData.seaLevels);
        }

        function syncTimelinePositions(chart) {
            const meta = chart.getDatasetMeta(0);
            if (!meta || !meta.data) return;

            const cols = document.querySelectorAll('.timeline-col');
            const stepWidth = meta.data.length > 1 ? meta.data[1].x - meta.data[0].x : 0;

            meta.data.forEach((bar, i) => {
                if (cols[i]) {
                    cols[i].style.left = `${bar.x}px`;
                    if (stepWidth > 0) cols[i].style.width = `${stepWidth}px`;
                }
            });
        }

        function renderChart(labels, rawTimes, waveData, tideData) {
            const ctx = document.getElementById('marineChart').getContext('2d');
            const axisCtx = document.getElementById('axisChart').getContext('2d');

            if (myChart) myChart.destroy();
            if (axisChart) axisChart.destroy();

            const validWaveHeights = waveData.filter(v => v != null);
            const maxWaveVal = validWaveHeights.length > 0 ? Math.max(...validWaveHeights) : 0;
            const targetMax = maxWaveVal > 2.0 ? Math.ceil(maxWaveVal * 1.1 * 10) / 10 : 2.0;

            axisChart = new Chart(axisCtx, {
                type: 'bar',
                data: {
                    labels: [''],
                    datasets: [{ data: [0], yAxisID: 'yWave' }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: 0 },
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    scales: {
                        x: { display: false },
                        yWave: {
                            type: 'linear',
                            position: 'left',
                            beginAtZero: true,
                            max: targetMax,
                            afterFit: (scale) => { scale.width = 42; },
                            ticks: { color: '#38bdf8', font: { size: 10, weight: '600' }, padding: 3 },
                            grid: { display: false }
                        }
                    }
                }
            });

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '波高 (m)',
                            data: waveData,
                            backgroundColor: (c) => {
                                const a = c.chart.chartArea;
                                if (!a) return 'rgba(56, 189, 248, 0.7)';
                                const g = c.chart.ctx.createLinearGradient(0, a.top, 0, a.bottom);
                                g.addColorStop(0, 'rgba(186, 230, 253, 0.92)');
                                g.addColorStop(1, 'rgba(56, 189, 248, 0.8)');
                                return g;
                            },
                            borderWidth: 0,
                            borderRadius: { topLeft: 6, topRight: 6, bottomLeft: 2, bottomRight: 2 },
                            borderSkipped: false,
                            yAxisID: 'yWave',
                            order: 2
                        },
                        {
                            label: '潮位 (m)',
                            data: tideData,
                            type: 'line',
                            borderColor: '#fb923c',
                            backgroundColor: '#fb923c',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.3,
                            yAxisID: 'yTide',
                            order: 1
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    onClick: (e, activeElements) => {
                        if (activeElements.length > 0) {
                            selectIndex(activeElements[0].index);
                        } else {
                            const rect = e.chart.canvas.getBoundingClientRect();
                            const index = e.chart.scales.x.getValueForPixel(e.x - rect.left);
                            if (index >= 0 && index < rawTimes.length) {
                                selectIndex(index);
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        targetIndex: selectedIndex,
                        tooltip: {
                            filter: function(tooltipItem) {
                                return tooltipItem.datasetIndex === 0;
                            },
                            callbacks: {
                                title: function(tooltipItems) {
                                    if (!tooltipItems.length) return '';
                                    const index = tooltipItems[0].dataIndex;
                                    const dateStr = rawTimes[index];
                                    if (!dateStr) return '';

                                    const d = new Date(dateStr);
                                    const month = d.getMonth() + 1;
                                    const date = d.getDate();
                                    const hours = d.getHours().toString().padStart(2, '0');
                                    const days = ['日', '月', '火', '水', '木', '金', '土'];
                                    const dayName = days[d.getDay()];

                                    return `${month}/${date}(${dayName}) ${hours}:00`;
                                },
                                label: function(context) {
                                    const val = context.parsed.y;
                                    if (val == null) return '';
                                    return `波高: ${Number(val).toFixed(2)}m`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(51, 65, 85, 0.5)' },
                            ticks: {
                                color: (ctx) => isDaytime(new Date(rawTimes[ctx.index]).getHours()) ? '#f8fafc' : '#64748b',
                                font: (ctx) => ({
                                    size: (new Date(rawTimes[ctx.index]).getHours() % 3 === 0) ? 11 : 9,
                                    weight: (new Date(rawTimes[ctx.index]).getHours() % 3 === 0) ? 'bold' : 'normal'
                                })
                            }
                        },
                        yWave: {
                            type: 'linear',
                            position: 'left',
                            beginAtZero: true,
                            max: targetMax,
                            display: false
                        },
                        yTide: {
                            type: 'linear',
                            position: 'right',
                            grid: { display: false },
                            afterFit: (scale) => { scale.width = 42; },
                            ticks: { color: '#fb923c', font: { size: 10, weight: '600' }, padding: 3 }
                        }
                    }
                }
            });
        }

        function renderTimelineData(waveDirections, windSpeeds, windDirections) {
            const container = document.getElementById('timelineWrapper');
            container.innerHTML = '';

            if (!waveDirections) return;

            const fragment = document.createDocumentFragment();

            waveDirections.forEach((wDeg, i) => {
                const waveInfo = getDirectionInfo(wDeg);
                const windDeg = windDirections ? windDirections[i] : null;
                const windInfo = getDirectionInfo(windDeg);
                const wSpeed = windSpeeds && windSpeeds[i] != null ? windSpeeds[i] : '--';

                const waveAngle = toShoreRelativeAngle(wDeg);
                const windAngle = toShoreRelativeAngle(windDeg);

                const col = document.createElement('div');
                col.className = 'timeline-col';
                col.onclick = () => selectIndex(i);

                col.innerHTML = `
                    <div class="wave-dir-arrow" title="波向: ${waveInfo.text}"><span style="display:inline-block; transform: rotate(${waveAngle}deg);">↑</span></div>
                    <div class="wind-val">${wSpeed}</div>
                    <div class="wind-arrow" title="風向: ${windInfo.text}"><span style="display:inline-block; transform: rotate(${windAngle}deg);">↑</span></div>
                `;
                fragment.appendChild(col);
            });

            container.appendChild(fragment);
        }

        window.onload = fetchData;

        window.addEventListener('resize', () => {
            const badgeEl = document.getElementById('windTypeBadge');
            if (badgeEl) fitTextToWidth(badgeEl);
        });
    </script>
