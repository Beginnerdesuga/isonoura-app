<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>磯ノ浦 リアルタイム海況ダッシュボード</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* ==========================================================================
       1. CSS Variables & Reset
       ========================================================================== */
    :root {
      /* Base Dark Theme Colors */
      --bg-dashboard: #0b0f19;
      --bg-card: rgba(22, 30, 46, 0.75);
      --bg-card-hover: rgba(30, 41, 59, 0.85);
      --border-card: rgba(255, 255, 255, 0.08);
      
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;

      /* Time Zone Accent Colors */
      --color-day: #f59e0b;
      --color-day-glow: rgba(245, 158, 11, 0.15);
      --color-night: #38bdf8;
      --color-night-glow: rgba(56, 189, 248, 0.15);
      --color-twilight: #f43f5e;
      --color-twilight-glow: rgba(244, 63, 94, 0.18);

      /* Status Colors */
      --status-good: #10b981;
      --status-warn: #f59e0b;

      /* UI Transitions */
      --transition-smooth: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dashboard);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 70%),
        radial-gradient(circle at 80% 20%, rgba(245, 158, 11, 0.03) 0%, transparent 50%);
    }

    .dashboard-container {
      width: 100%;
      max-width: 1000px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ==========================================================================
       2. Common Glassmorphism Card Style
       ========================================================================== */
    .data-card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 20px 24px;
      transition: var(--transition-smooth);
      position: relative;
      overflow: hidden;
    }

    /* Dynamic Time-based Ambient Glows */
    .data-card.is-day {
      border-color: rgba(245, 158, 11, 0.3);
      box-shadow: 0 8px 32px -4px var(--color-day-glow),
                  inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .data-card.is-night {
      border-color: rgba(56, 189, 248, 0.25);
      box-shadow: 0 8px 32px -4px var(--color-night-glow),
                  inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    .data-card.is-twilight {
      border-color: rgba(244, 63, 94, 0.35);
      box-shadow: 0 8px 32px -4px var(--color-twilight-glow),
                  inset 0 1px 1px rgba(255, 255, 255, 0.08);
    }

    /* ==========================================================================
       3. Header & Time Controller
       ========================================================================== */
    .header-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .location-info h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .location-info .sub-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .time-selector {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      gap: 4px;
    }

    .time-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition-smooth);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .time-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .time-btn.active[data-phase="day"] {
      color: var(--color-day);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .time-btn.active[data-phase="twilight"] {
      color: var(--color-twilight);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .time-btn.active[data-phase="night"] {
      color: var(--color-night);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    /* ==========================================================================
       4. Status Badges & Glow Animations
       ========================================================================== */
    .time-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .badge-day {
      background: rgba(245, 158, 11, 0.12);
      color: var(--color-day);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-twilight {
      background: rgba(244, 63, 94, 0.12);
      color: var(--color-twilight);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .badge-night {
      background: rgba(56, 189, 248, 0.12);
      color: var(--color-night);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .glow-icon {
      display: inline-block;
      animation: pulseGlow 3s infinite alternate ease-in-out;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); filter: drop-shadow(0 0 2px currentColor); }
      100% { transform: scale(1.1); filter: drop-shadow(0 0 8px currentColor); }
    }

    /* ==========================================================================
       5. Metrics Grid
       ========================================================================== */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .metric-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .metric-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-value {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 12px 0 4px;
      letter-spacing: -0.03em;
    }

    .metric-sub {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    /* ==========================================================================
       6. Chart Area
       ========================================================================== */
    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .chart-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .chart-container {
      position: relative;
      height: 280px;
      width: 100%;
    }

    /* Responsive */
    @media (max-width: 640px) {
      body { padding: 12px 8px; }
      .header-card { flex-direction: column; align-items: flex-start; }
      .time-selector { width: 100%; justify-content: space-between; }
      .time-btn { flex: 1; justify-content: center; padding: 8px 6px; }
      .metrics-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

  <div class="dashboard-container">

    <!-- 1. HEADER CARD (Dynamic Ambient Glow) -->
    <header class="data-card header-card is-twilight" id="headerCard">
      <div class="location-info">
        <h1>
          磯ノ浦 (Isonoura) 
          <span class="time-badge badge-twilight" id="phaseBadge">
            <span class="glow-icon">🌅</span> 朝マズメ (Dawn)
          </span>
        </h1>
        <div class="sub-text">和歌山県和歌山市 ・ 34.25°N, 135.08°E</div>
      </div>

      <!-- Time Phase Switcher (Demo Interactive) -->
      <div class="time-selector">
        <button class="time-btn" data-phase="day" onclick="setPhase('day')">
          <span>☀️</span> 昼 (Day)
        </button>
        <button class="time-btn active" data-phase="twilight" onclick="setPhase('twilight')">
          <span>🌅</span> 朝・夕 (Twilight)
        </button>
        <button class="time-btn" data-phase="night" onclick="setPhase('night')">
          <span>🌙</span> 夜 (Night)
        </button>
      </div>
    </header>

    <!-- 2. METRICS OVERVIEW -->
    <div class="metrics-grid">
      <div class="data-card metric-card is-twilight" id="metric1">
        <div class="metric-label">
          <span>波高 (Wave Height)</span>
          <span>🌊</span>
        </div>
        <div class="metric-value" style="color: var(--text-main);">0.8m</div>
        <div class="metric-sub">セット腰〜腹 ・ 周期 5.2s</div>
      </div>

      <div class="data-card metric-card is-twilight" id="metric2">
        <div class="metric-label">
          <span>風速・風向 (Wind)</span>
          <span>🍃</span>
        </div>
        <div class="metric-value" style="color: var(--status-good);">2.4m/s</div>
        <div class="metric-sub">オフショア (北東) ・ 面良好</div>
      </div>

      <div class="data-card metric-card is-twilight" id="metric3">
        <div class="metric-label">
          <span>潮位 (Tide Level)</span>
          <span>📉</span>
        </div>
        <div class="metric-value" style="color: var(--text-main);">142cm</div>
        <div class="metric-sub">中潮 ・ 06:12 満潮</div>
      </div>

      <div class="data-card metric-card is-twilight" id="metric4">
        <div class="metric-label">
          <span>海水温 (Water Temp)</span>
          <span>🌡️</span>
        </div>
        <div class="metric-value" style="color: var(--color-day);">22.5°C</div>
        <div class="metric-sub">3mmフルスーツ〜スプリング</div>
      </div>
    </div>

    <!-- 3. MAIN CHART CARD WITH DAY/NIGHT BACKGROUND SHADING -->
    <section class="data-card is-twilight" id="chartCard">
      <div class="chart-header">
        <div class="chart-title">24時間 波高・風速推移 & 昼夜エリア</div>
        <div class="metric-sub">背景の薄暗い領域＝夜間（日没〜日の出）</div>
      </div>
      <div class="chart-container">
        <canvas id="seaConditionChart"></canvas>
      </div>
    </section>

  </div>

  <script>
    /* ==========================================================================
       Chart.js Plugin: Day/Night Background Shading
       ========================================================================== */
    const dayNightPlugin = {
      id: 'dayNightBackground',
      beforeDraw(chart) {
        const { ctx, chartArea, scales: { x } } = chart;
        if (!chartArea) return;

        // 24時間データにおける昼夜・トワイライトのインデックス指定 (0〜23時)
        // 例: 00:00~05:00(夜), 05:00~06:00(朝マズメ), 06:00~18:00(昼), 18:00~19:00(夕マズメ), 19:00~23:00(夜)
        const timePhases = [
          { start: 0, end: 5, color: 'rgba(5, 8, 16, 0.55)' },       // 夜間
          { start: 5, end: 6.5, color: 'rgba(244, 63, 94, 0.12)' },   // 朝マズメ
          { start: 6.5, end: 17.5, color: 'rgba(255, 255, 255, 0.02)' }, // 昼間
          { start: 17.5, end: 19, color: 'rgba(244, 63, 94, 0.12)' }, // 夕マズメ
          { start: 19, end: 23, color: 'rgba(5, 8, 16, 0.55)' }      // 夜間
        ];

        ctx.save();
        timePhases.forEach(phase => {
          const xStart = x.getPixelForValue(phase.start);
          const xEnd = x.getPixelForValue(phase.end);
          
          ctx.fillStyle = phase.color;
          ctx.fillRect(
            xStart, 
            chartArea.top, 
            xEnd - xStart, 
            chartArea.bottom - chartArea.top
          );
        });
        ctx.restore();
      }
    };

    // Chart.js インスタンス生成
    const ctx = document.getElementById('seaConditionChart').getContext('2d');
    const seaChart = new Chart(ctx, {
      type: 'line',
      plugins: [dayNightPlugin],
      data: {
        labels: ['00:00', '02:00', '04:00', '06:00', '08:00', '10:00', '12:00', '14:00', '16:00', '18:00', '20:00', '22:00', '24:00'],
        datasets: [
          {
            label: '波高 (m)',
            data: [0.4, 0.4, 0.5, 0.8, 0.9, 0.7, 0.6, 0.5, 0.7, 0.8, 0.6, 0.5, 0.4],
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            borderWidth: 3,
            fill: true,
            tension: 0.4,
            pointRadius: 4,
            pointBackgroundColor: '#38bdf8'
          },
          {
            label: '風速 (m/s)',
            data: [1.2, 1.5, 1.8, 2.4, 3.1, 4.0, 4.5, 3.8, 2.9, 2.1, 1.8, 1.4, 1.1],
            borderColor: '#f59e0b',
            borderDash: [5, 5],
            borderWidth: 2,
            fill: false,
            tension: 0.3,
            pointRadius: 0
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            labels: { color: '#94a3b8', font: { size: 12 } }
          },
          tooltip: {
            backgroundColor: 'rgba(15, 23, 42, 0.9)',
            titleColor: '#f1f5f9',
            bodyColor: '#cbd5e1',
            borderColor: 'rgba(255, 255, 255, 0.1)',
            borderWidth: 1
          }
        },
        scales: {
          x: {
            grid: { color: 'rgba(255, 255, 255, 0.05)' },
            ticks: { color: '#64748b' }
          },
          y: {
            grid: { color: 'rgba(255, 255, 255, 0.05)' },
            ticks: { color: '#64748b' },
            beginAtZero: true
          }
        }
      }
    });

    /* ==========================================================================
       Dynamic Theme Switching (Demo Controls)
       ========================================================================== */
    function setPhase(phase) {
      const cards = document.querySelectorAll('.data-card');
      const buttons = document.querySelectorAll('.time-btn');
      const badge = document.getElementById('phaseBadge');

      // Update Active Button
      buttons.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.phase === phase);
      });

      // Update Card Glow Styles
      cards.forEach(card => {
        card.classList.remove('is-day', 'is-night', 'is-twilight');
        card.classList.add(`is-${phase}`);
      });

      // Update Badge Text & Style
      badge.className = `time-badge badge-${phase}`;
      if (phase === 'day') {
        badge.innerHTML = '<span class="glow-icon">☀️</span> 昼 (Daytime)';
      } else if (phase === 'twilight') {
        badge.innerHTML = '<span class="glow-icon">🌅</span> 朝マズメ (Dawn)';
      } else {
        badge.innerHTML = '<span class="glow-icon">🌙</span> 夜 (Night)';
      }
    }
  </script>
</body>
</html>
